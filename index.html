<style>
/* Tactical tribe, PumaRally's palette: the same TOKENS table, retyped here
 * because this is a single file and imports nothing. */
:root{--bg:#05070f;--panel:#0a0e1a;--panel2:#0d1424;--line:#1b2540;--lit:#47609c;
  --text:#dbe4fb;--ink:#8b96b8;--dim:#7d8aa8;--accent:#54f2ff;--warn:#ffb000;--danger:#ff5266;
  --good:#4ade6a;--violet:#b47dff;--steel:#94a0c4;--blue:#4c8dff}
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--term:1100px;
  --row:#0f1628;--z-scene:0;--z-stage:1;--z-sticky:5;--z-modal:10}
*{box-sizing:border-box}
html{color-scheme:dark}
/* Scrollbars in the terminal's colours: a thin steel thumb on the panel.
 * scrollbar-color covers Firefox and current Chromium; the ::-webkit rules
 * cover Safari and older Chromium. */
*{scrollbar-width:thin;scrollbar-color:var(--lit) var(--panel)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--lit);border:2px solid var(--panel);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--steel)}
::-webkit-scrollbar-corner{background:var(--panel)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;
  -webkit-text-size-adjust:100%}
.boot{padding:var(--s5)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:3px;
  padding:5px 10px;cursor:pointer;min-height:34px}
button:hover:not(:disabled){border-color:var(--lit)}
button:focus-visible,input:focus-visible,tr:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.4;cursor:default}
button.primary{border-color:var(--accent);color:var(--accent)}
button.danger{border-color:var(--danger);color:var(--danger)}
button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:5px 8px;min-height:34px}
kbd{font:inherit;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:2px;padding:0 4px;margin-right:6px}
h1{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0;font-weight:600}
h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:var(--s4) 0 var(--s2);font-weight:600}
h2:first-child{margin-top:0}
p{margin:0 0 var(--s2)}

.scene{position:fixed;inset:0;z-index:var(--z-scene);pointer-events:none;overflow:hidden;
  background:linear-gradient(#05070f 0%,#070b17 40%,#0c1020 68%,#181622 88%,#231a17 100%)}
.scene.under{background:linear-gradient(#04060c 0%,#080b14 55%,#0b0e17 100%)}
.scene .layer{position:absolute;inset:0;opacity:0;transition:opacity .8s cubic-bezier(.22,1,.36,1)}
.scene .layer.on{opacity:1}
.scene svg{display:block;width:100%;height:100%}
.scene .sf{fill:#0a0f1d;stroke:#2a3960;stroke-width:2;stroke-linejoin:round}
.scene .sf.rock{fill:#070a12}
.scene .sground{fill:#070a13}
.scene .sl{fill:none;stroke:#2a3960;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scene .sd{fill:none;stroke:#1d2948;stroke-width:1.5;stroke-linecap:round}
.scene .sw{fill:#ffb000;opacity:.3}
.scene .swl{fill:none;stroke:#ffb000;stroke-width:2;opacity:.3}
.scene .sx{fill:#111a30}
.scene .sa{fill:none;stroke:#54f2ff;stroke-width:2;opacity:.42}
.scene .sad{fill:#54f2ff;opacity:.45}
.scene .st{fill:#8b96b8;opacity:.45}
.scene .smoon{fill:#ffb000;opacity:.55}
.scene .ssky{fill:#05070f}
.scene .sglow{fill:#ffb000;opacity:.035}
.scene .sbeam{fill:url(#pcb)}
.scene .sbeam.c{fill:url(#pcc)}
.scene .shaz{fill:#ffb000;opacity:.16}
.scene .stx{font:600 18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;fill:#54f2ff;opacity:.5}
.scene .stx.sm{font-size:11px;letter-spacing:.12em;fill:#ffb000;opacity:.55}
.scene .stx.xs{font-size:7px;letter-spacing:.1em;fill:#8b96b8;opacity:.6}
.scene .stx.big{font-size:44px;fill:#ffb000;opacity:.3}
.top .place-name.arrive{animation:arrive .5s cubic-bezier(.22,1,.36,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .scene .layer{transition:none}
  .top .place-name.arrive{animation:none}
}
/* The stage centres the terminal in the window, both ways, over the scenery. */
.stage{position:relative;z-index:var(--z-stage);min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:var(--s6) var(--s5)}
.pc{width:min(var(--term),100%);background:var(--bg);border:1px solid var(--line);border-radius:4px;
  box-shadow:0 0 0 1px rgba(5,7,15,.6),0 30px 90px rgba(0,0,0,.65)}

/* Header: where you are and when, together, because that is what changed. */
.top{display:flex;align-items:baseline;gap:var(--s4);padding:var(--s4) var(--s5) var(--s3)}
.top .place-name{margin:0;font-size:20px;letter-spacing:.04em;text-transform:none;color:var(--text);font-weight:600}
.top .day{color:var(--dim);white-space:nowrap}
.top .day b{color:var(--text);font-weight:600}
.top .day.last b,.top .day.last{color:var(--warn)}
.top .grow{flex:1}
.top .brand{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:600}
.dayline{height:2px;background:var(--line)}
.dayline i{display:block;height:100%;background:var(--accent)}
.dayline.last i{background:var(--warn)}

/* Status: cash and debt lead; the rest support. */
.status{display:grid;grid-template-columns:repeat(2,minmax(0,1.3fr)) repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.stat{padding:var(--s3) var(--s4);border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stat span{color:var(--text);white-space:nowrap}
.stat.lead span{font-size:20px;font-weight:600;line-height:1.3}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--dim)}
.stat.bad span,.stat.bad em{color:var(--danger)}
.stat.warn span{color:var(--warn)}
.stat.cash{position:relative}
.delta{position:absolute;right:var(--s4);top:var(--s2);font-size:13px;font-weight:600;pointer-events:none;
  animation:deltaUp 1s cubic-bezier(.22,1,.36,1) forwards}
.delta.up{color:var(--good)}.delta.down{color:var(--steel)}
@keyframes deltaUp{from{opacity:0;transform:translateY(8px)}18%{opacity:1}70%{opacity:1}to{opacity:0;transform:translateY(-12px)}}
.mk tr.traded td{animation:rowFlash .85s cubic-bezier(.22,1,.36,1)}
@keyframes rowFlash{from{background:rgba(84,242,255,.13)}}
.mk .hq{display:inline-block;font-weight:inherit}
.mk .hq.pulse{animation:hqPulse .55s cubic-bezier(.22,1,.36,1)}
@keyframes hqPulse{35%{transform:scale(1.3);color:var(--accent)}}
@media (prefers-reduced-motion:reduce){.delta,.mk tr.traded td,.mk .hq.pulse{animation:none}}
.meter{display:block;height:6px;margin-top:var(--s1);background:var(--panel2);border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--good)}
.meter.heat i{background:var(--warn)}
.meter.low i{background:var(--danger)}

/* The market column sets the row height; the log is taken out of flow so it
 * fills whatever height that is and scrolls, instead of stretching the page. */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px}
.market{padding:var(--s4) var(--s5) var(--s5);min-width:0}
table.mk{width:100%;border-collapse:collapse}
.mk th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:right;font-weight:600;
  padding:var(--s1) var(--s2);border-bottom:1px solid var(--line)}
.mk th.name,.mk th.held{text-align:left}
.mk td{padding:5px var(--s2);text-align:right;border-bottom:1px solid var(--row);white-space:nowrap}
.mk td.key{color:var(--dim);width:2em;text-align:left;padding-left:var(--s2)}
.mk td.name{text-align:left;color:var(--text);width:8.5em}
.mk td.price{width:7.5em;font-variant-numeric:tabular-nums}
.mk td.held{text-align:left;color:var(--text)}
.mk td.held small{color:var(--dim);font-size:12px;margin-left:var(--s1)}
.mk tr{cursor:pointer}
.mk tr:hover td{background:rgba(13,20,36,.6)}
.mk tr.sel td{background:#101a30}
.mk tr.sel td.key{color:var(--accent);box-shadow:inset 2px 0 var(--accent)}
.mk tr.sel td.name{color:var(--accent)}
.mk tr.news td.name::after{content:" !";color:var(--warn)}
.mk td.btns{width:1%;padding-right:0}
/* Eighteen trade buttons are noise until you're on their row: ghosted, then solid. */
.mk td.btns button{min-width:52px;padding:3px 8px;min-height:30px;background:transparent;border-color:transparent;color:var(--steel)}
.mk td.btns button:disabled{color:var(--dim)}
.mk tr:hover td.btns button:not(:disabled),.mk tr.sel td.btns button:not(:disabled),
.mk td.btns button:focus-visible{background:var(--panel2);border-color:var(--line);color:var(--text)}
.mk .out{color:var(--dim)}
.mk th.range,.mk td.range{text-align:left}
.mk td.range{width:13em}
.track{display:inline-block;position:relative;width:64px;height:8px;margin-right:var(--s2);vertical-align:middle;
  border-left:1px solid var(--lit);border-right:1px solid var(--lit);background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.track i{position:absolute;top:-2px;width:3px;height:12px;margin-left:-1px;background:var(--text);border-radius:1px}
.rw{font-size:12px;color:var(--dim)}
.rw-m{display:none}
.rw.bargain,.rw.cheap{color:var(--good)}
.rw.steep{color:var(--warn)}
.rw.sky-high{color:var(--warn)}
.ticker{margin:0 0 var(--s3);padding:6px var(--s3);border:1px solid #3a2e10;border-radius:3px;background:rgba(255,176,0,.06);color:var(--warn)}
.coach{display:flex;gap:var(--s3);align-items:baseline;margin:0 0 var(--s3);padding:6px var(--s3);border:1px solid #17485a;border-radius:3px;background:rgba(84,242,255,.05);color:var(--text)}
.coach b{flex:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.coach span{flex:1}
.coach kbd{margin:0 2px}
button.link{min-height:0;padding:0 var(--s1);border:0;background:none;color:var(--steel);text-decoration:underline;cursor:pointer}
button.link:hover{color:var(--text)}
@media (max-width:700px){.coach{flex-wrap:wrap}.coach kbd{display:inline}}
.ticker b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-right:var(--s2)}
.up{color:var(--good)}.down{color:var(--danger)}
/* The trend arrow is direction only; colour on a row belongs to 'vs usual',
 * so a falling price never shows red beside a green 'cheap'. */
.mk .tr{color:var(--steel);font-size:12px}
.mk tr.trade-row{cursor:default}
.mk tr.trade-row td,.mk tr.trade-row:hover td{background:#0b1222;padding:var(--s2) var(--s3);text-align:left;white-space:normal;border-bottom:1px solid var(--lit)}
.trade{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);align-items:baseline}
.trade .tv{color:var(--accent);font-weight:600}
.qrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;margin-top:var(--s1)}
.qrow input{width:6em}
.qrow .total{margin-left:auto;margin-right:var(--s2)}
.qrow .risk{flex-basis:100%;font-size:12px;color:var(--steel)}
.qrow .risk:empty{display:none}
.stat.warn em{color:var(--warn)}
.travel,.sidepanel{position:absolute;inset:0;overflow:auto;padding:var(--s4) var(--s5)}
.sidepanel .row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin:var(--s2) 0}
.sidepanel .row input{width:8em}
.sidepanel table{width:100%;border-collapse:collapse}
.sidepanel td{padding:var(--s1) 0;vertical-align:top;border-bottom:1px solid var(--row)}
.sidepanel td.r{text-align:right;padding-left:var(--s2)}
.sidepanel .note{color:var(--dim);font-size:12px}
.sidepanel .acts{margin-top:var(--s3)}
.confirm-note{margin:var(--s3) 0 0;color:var(--warn)}
.dest{list-style:none;margin:0 0 var(--s3);padding:0;display:grid;gap:6px}
.dest button{width:100%;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 var(--s2);padding:6px var(--s3)}
.dest button kbd{grid-row:span 2;align-self:center}
.dest button span{font-size:12px;color:var(--dim)}
.flash{margin-top:var(--s2);color:var(--danger)}
.flash:empty{display:none}
.market .bar{margin-top:var(--s4)}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.place{padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.place .spec{color:var(--text);margin-bottom:var(--s2)}
.place .blurb{color:var(--dim);font-style:italic;font-size:13px;line-height:1.45}
.place h2{margin:var(--s3) 0 var(--s1)}
.gearlist{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:12px}
.gearlist li{display:flex;justify-content:space-between;gap:var(--s3)}
.gearlist li span:first-child{color:var(--ink)}
.gearlist li span:last-child{color:var(--dim);text-align:right}
.place .gear{color:var(--dim);font-size:12px;margin:0}
.tip{margin-top:var(--s2);padding:6px var(--s2);border:1px dashed var(--line);font-size:12px;color:var(--steel)}
.tip b{color:var(--accent);font-weight:600}
.logwrap{flex:1;position:relative;min-height:180px}
.log{position:absolute;inset:0;overflow:auto;padding:var(--s3) var(--s5)}
.log p{margin:0 0 3px}
.log .day{color:var(--accent);margin-top:var(--s3)}
.log p:first-child{margin-top:0}
.news{color:var(--warn)}.bad{color:var(--danger)}.good{color:var(--good)}.enc{color:var(--violet)}
.trade{color:var(--steel)}.dim{color:var(--dim)}.warn{color:var(--warn)}
.bar{display:flex;gap:var(--s2);flex-wrap:wrap;padding:var(--s2);border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.bar .grow{flex:1}

.back{position:fixed;inset:0;background:rgba(2,4,10,.8);display:flex;align-items:center;justify-content:center;padding:var(--s4);z-index:var(--z-modal)}
.modal{background:var(--panel);border:1px solid var(--lit);border-radius:4px;max-width:540px;width:100%;
  max-height:calc(100dvh - 32px);overflow:auto;padding:var(--s4) var(--s5)}
.modal h1{margin-bottom:var(--s3)}
.modal .row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin:var(--s2) 0}
.modal .row input{width:9em}
.modal .acts{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}
.modal .note{color:var(--dim);font-size:12px}
.modal table{width:100%;border-collapse:collapse}
.modal td,.modal th{padding:var(--s1) 6px;text-align:left;border-bottom:1px solid var(--row);vertical-align:top}
.modal th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.modal td.r,.modal th.r{text-align:right}
.back.enc-back{background:rgba(2,4,10,.66)}
/* Encounters are the drama: a heading coloured by who's in front of you. */
.modal.encounter{max-width:580px;box-shadow:0 24px 70px rgba(0,0,0,.7)}
.modal.encounter h1{font-size:22px;letter-spacing:.12em;padding-bottom:var(--s2);margin-bottom:var(--s3);border-bottom:1px solid currentColor}
.modal.t-watchers h1{color:var(--danger)}
.modal.t-boss h1,.modal.t-goons h1{color:var(--warn)}
.modal.t-rival h1{color:var(--violet)}
.modal.t-stray h1{color:var(--accent)}
.modal.enter{animation:encIn .32s cubic-bezier(.22,1,.36,1) both}
@keyframes encIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal.enter{animation:none}}
.foes{margin:var(--s3) 0}
.choices{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:var(--s2) var(--s3);align-items:center;margin-top:var(--s4)}
.choices button{text-align:left}
.choices .cost{font-size:12px;color:var(--steel)}
.foe{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:var(--s3);align-items:center;margin:var(--s1) 0;color:var(--text)}
.elog{margin-top:var(--s3);padding:var(--s2);background:var(--bg);border:1px solid var(--line);max-height:150px;overflow:auto;font-size:13px}
.elog p{margin:0 0 2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--s3)}
.help dt{color:var(--text)}
.help dd{margin:0 0 var(--s2) 0;color:var(--ink)}

.setup{width:min(640px,100%);padding:var(--s6) var(--s6) var(--s5)}
.setup .sky{display:block;width:100%;height:auto;margin:0 0 var(--s1)}
.setup .title{font-size:26px;letter-spacing:.35em;color:var(--accent);margin:0}
.setup .tag{color:var(--steel);margin:var(--s1) 0 var(--s3)}
.setup .row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin:var(--s3) 0}
.setup .row label{width:7em;color:var(--dim)}
.setup .row input{flex:1;min-width:10em;max-width:20em}
.setup .acts{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s5) 0 var(--s6)}
.setup table.scores{border-collapse:collapse;width:100%}
.setup .scores td,.setup .scores th{padding:var(--s1) var(--s2);text-align:left;border-bottom:1px solid var(--row)}
.setup .scores th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.scores td.r,.scores th.r{text-align:right}
.scores td:last-child{white-space:nowrap}
.scores .rip{color:var(--danger)}
.final{font-size:32px;font-weight:600;color:var(--text);margin:var(--s1) 0 0;font-variant-numeric:tabular-nums}
.final.neg{color:var(--danger)}
.verdict{margin:0 0 var(--s3)}
.verdict.best{color:var(--accent)}
.primer{margin:0 0 var(--s4);padding-left:1.5em;color:var(--ink)}
.primer li{margin:2px 0}
.primer .rw{font-size:inherit}
.foot{color:var(--dim);font-size:12px;margin-top:var(--s6)}
.foot a{color:var(--steel)}

/* Laptops (1280x800 is the common case): a narrower, shorter terminal, so
 * the district's landmarks keep real space at the sides and above. */
@media (min-width:901px) and (max-width:1400px){
  :root{--term:1000px}
  .stage{padding:var(--s4)}
  .main{grid-template-columns:minmax(0,1fr) 330px}
  .mk td.range{width:11em}
  .track{width:52px}
  .market,.place,.log{padding-left:var(--s4);padding-right:var(--s4)}

}
@media (min-width:901px) and (max-height:860px){

  .setup{margin:0 auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .side{border-left:0;border-top:1px solid var(--line)}

@media (max-width:700px){

  button{min-height:44px}

  .mk .key,.mk .range{display:none}

  kbd{display:none}
  .modal{padding:14px}

<body>
<div class="scene" id="pc-scene" aria-hidden="true"></div>
<div class="sr-only" id="pc-live" aria-live="polite" aria-atomic="false"></div>
<div data-pumacity-game><p class="boot">Hitting the streets…</p></div>
<script>
'use strict';
// ===== @core-begin =====
/* Everything between the core markers is data and rules with no DOM. The tools
 * under tools/ cut this block out of the page and run it under Node, so the
 * browser and the tests play exactly the same game. Nothing in here may touch
 * the page, the clock or browser storage -- all randomness comes from st.rng. */

const VERSION = '1.0.0';

const CONFIG = {
  lengths: [30, 60, 90],
  startCash: 1500,
  startDebt: 8000,
  startLoc: 'plaza',
  baseCap: 100,
  maxHp: 100,
  debtRate: 0.10,     // per day, compounding
  bankRate: 0.01,     // per day, compounding
  debtCap: 50000,     // the most The Boss will have on her books for you
  goonDays: 8,        // days without a real repayment before the goons come
  repayReset: 0.10,   // a repayment of at least this share of the debt counts as "real"
  heatDecay: 4,       // per day
  eventChance: 0.12,  // a market headline on any given day: rarer, but sharper
  eventUp: [3, 5],   // a spike multiplies the price by this range
  eventDown: [0.2, 0.4],
  carryWatch: 1 / 150000, // extra Watcher odds per $1 of goods carried (at usual mid prices)
  carryWatchMax: 0.35,     // ...capped here
  dropOnFail: 0.4,     // share of each good you drop when a getaway fails
  vetPerHp: 15,
  logMax: 150,
};

const GOODS = [
  { id: 'nip',        name: 'Catnip',     lo: 10,    hi: 60,    blurb: "Ditch-grade 'nip. Cheap, bulky, everywhere." },
  { id: 'feathers',   name: 'Feathers',   lo: 40,    hi: 150,   blurb: 'Wand-toy plumage. Kittens go wild for it.' },
  { id: 'nappers',    name: 'Nappers',    lo: 100,   hi: 400,   blurb: 'Sleepy pills, for the cat who has had enough of today.' },
  { id: 'zoomers',    name: 'Zoomers',    lo: 200,   hi: 700,   blurb: 'Three in the morning, in capsule form.' },
  { id: 'silvervine', name: 'Silvervine', lo: 300,   hi: 900,   blurb: "Refined vine chews. 'nip's classier cousin." },
  { id: 'psychos',    name: 'Psychos',    lo: 600,   hi: 1800,  blurb: 'Mushrooms that make the wallpaper move.' },
  { id: 'reddot',     name: 'Red Dot',    lo: 1000,  hi: 4500,  blurb: 'You will never catch it. You will never stop trying.' },
  { id: 'moonsugar',  name: 'Moonsugar',  lo: 5000,  hi: 14000, blurb: 'Crystal sugar that comes in on the ship. Pricey.' },
  { id: 'skooma',     name: 'Skooma',     lo: 10000, hi: 28000, blurb: "Moonsugar, cooked down. The Boss's favourite." },
];
const GOOD = Object.fromEntries(GOODS.map(g => [g.id, g]));

/* mods multiply a good's price here; `all` multiplies every good. watch, mug
 * and boss scale those encounters; cool is extra heat shed per day here. */
const PLACES = [
  { id: 'plaza', name: 'Market Plaza', service: null, serviceName: 'Outfitter', shop: ['fanny', 'saddle', 'spray', 'laser', 'claws', 'collar', 'mittens', 'shades'],
    mods: { psychos: 1.1, reddot: 1.15, moonsugar: 1.15, skooma: 1.15 }, watch: 1, mug: 1.5,
    blurb: "Downtown: an open-air mall of stucco arcades, palms and fountains, full of tourists with money to spend.",
    special: 'Tourists pay a premium for luxury goods. The outfitter sells pouches, weapons and accessories.' },
  { id: 'pvn', name: 'PVN Tower', service: 'loan', serviceName: "The Boss's office", shop: [],
    mods: { skooma: 1.25 }, watch: 1, boss: 3,
    blurb: "Casey Benton's office tower: a theater at ground level, a nightclub above it, and her office in the penthouse.",
    special: 'The Boss lends money from the penthouse. Skooma sells high at the club.' },
  { id: 'vault', name: 'The Vault', service: 'bank', serviceName: "Overseer's terminal", shop: [],
    mods: {}, watch: 0.8, mug: 0.3,
    blurb: "A fully stocked vault under the city, waiting for PumaCity's leadership in case of war. Until then, the Overseer runs it as a bank.",
    special: 'Money in the Vault is safe from muggers and the Watchers.' },
  { id: 'ranch', name: 'The Ranch', service: null, serviceName: '', shop: [],
    mods: { nip: 0.45 }, watch: 0.5, cool: 6,
    blurb: "An old horse ranch on the edge of town, its paddocks turned over to grow fields.",
    special: "Catnip is cheap, and the Watchers rarely come out this far." },
  { id: 'starport', name: 'Starport', service: null, serviceName: 'Outfitter, Bay 9', shop: ['hovercrate', 'mech'],
    mods: { moonsugar: 0.8, skooma: 0.8 }, watch: 1.3,
    blurb: "Where the ship lands, trading PumaCity's goods with other ports.",
    special: "Moonsugar and Skooma come in cheap off the ship. The outfitter in Bay 9 sells gear you can't get in town." },
  { id: 'convention', name: 'The Convention Center', service: null, serviceName: 'Tech expo', shop: ['pawphone'],
    all: 1.2, mods: {}, watch: 1.1, mug: 3,
    blurb: 'The convention center by the starport, with a different event every week.',
    special: 'Crowds pay over the odds for everything. Pickpockets work the crowd.' },
  { id: 'suburbs', name: 'Suburbs', service: 'vet', serviceName: 'Vet', shop: [],
    mods: {}, watch: 0.9,
    blurb: 'Single-family homes on quiet cul-de-sacs, every one of them rented from Casey Benton.',
    special: 'The vet patches you up.' },
];
const PLACE = Object.fromEntries(PLACES.map(p => [p.id, p]));

/* Within a slot, later entries outrank earlier ones: you can trade up, never down. */
const GEAR = {
  fanny:      { slot: 'pouch',    a: 'a', name: 'Fanny Pouch',     price: 400,   cap: 30,  short: "+30 space", blurb: '+30 carrying space.' },
  saddle:     { slot: 'pouch',    a: 'some', name: 'Saddlebags',      price: 1500,  cap: 60,  short: "+60 space", blurb: '+60 carrying space.' },
  hovercrate: { slot: 'pouch',    a: 'a', name: 'Hover-Crate',     price: 9000,  cap: 120, short: "+120 space", blurb: '+120 carrying space. Floats along behind you.' },
  spray:      { slot: 'weapon',   a: 'a', name: 'Spray Bottle',    price: 300,   dmg: [4, 9],   short: "4–9 a hit", blurb: 'Nobody likes getting wet. Hits for 4–9.' },
  laser:      { slot: 'weapon',   a: 'a', name: 'Laser Pointer',   price: 900,   dmg: [7, 13],  short: "7–13 a hit", blurb: 'They cannot help chasing it. Hits for 7–13.' },
  claws:      { slot: 'weapon',   a: 'some', name: 'Sharpened Claws', price: 2500,  dmg: [11, 19], short: "11–19 a hit", blurb: 'A professional manicure. Hits for 11–19.' },
  mech:       { slot: 'weapon',   a: 'some', name: 'Mech-Claws',      price: 12000, dmg: [18, 30], short: "18–30 a hit", blurb: 'Off-world hydraulics. Hits for 18–30.' },
  collar:     { slot: 'armour',   a: 'a', name: 'Kevlar Collar',   price: 2000,  guard: 0.4, short: "−40% damage", blurb: 'Takes 40% off every hit.' },
  pawphone:   { slot: 'pawphone', a: 'a', name: 'Pawphone',        price: 1200,  short: "tomorrow's prices", blurb: "Each day, shows tomorrow's prices somewhere else in town." },
  mittens:    { slot: 'mittens',  a: 'some', name: 'Sneaky Mittens',  price: 800,   short: "better getaways", blurb: 'Kittens wear them. Much better odds when you run.' },
  shades:     { slot: 'shades',   a: 'some', name: 'Shades',          price: 600,   short: "half the heat", blurb: 'Heat builds half as fast.' },
};
const SLOTS = ['pouch', 'weapon', 'armour', 'pawphone', 'mittens', 'shades'];

const RIVALS = ['Tomcat Tony', 'Scraps McGee', 'Velvet', 'One-Ear Ollie', 'Duchess', 'Big Ginger', 'Mister Whiskers'];

/* Market headlines. {g} is the good's name. Specific lines win over generic ones. */
const NEWS = {
  up: [
    'Watchers raid a {g} den downtown. Prices are through the roof!',
    'Kittens are paying crazy money for {g}!',
    'A {g} shortage hits PumaCity. Sellers name their price!',
  ],
  down: [
    'A {g} shipment slips past customs. Prices crash!',
    'Somebody dumped a crate of {g} in the park. Prices hit the floor!',
    'Cheap {g} floods the streets!',
  ],
  nip: { down: "The Ranch harvest floods the market with cheap 'nip!" },
  feathers: { down: 'A pillow factory explodes. Feathers everywhere, prices crash!' },
  reddot: { up: 'The Boss bans laser pointers! Red Dot prices go wild!' },
  moonsugar: { up: "Customs impound the ship's Moonsugar. Prices skyrocket!" },
  skooma: { up: 'Casey Benton is throwing a party in the PVN Tower club. Skooma prices soar!' },
};

// ---- randomness: one 32-bit LCG whose whole state is st.rng (from pumarally's rng.js)
function nextState(s) { return (Math.imul(s | 0, 1664525) + 1013904223) | 0; }
function rnd(st) { st.rng = nextState(st.rng); return ((st.rng >>> 8) & 0xffffff) / 0x1000000; }
function rndInt(st, n) { return Math.floor(rnd(st) * n); }
function rndRange(st, a, b) { return a + rndInt(st, b - a + 1); }
function pick(st, arr) { return arr[rndInt(st, arr.length)]; }
/* Deterministic hash, for bot choices that must not move the game's RNG. */
function hash32(n) {
  let x = n | 0;
  x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
  x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
  x = x ^ (x >>> 16);
  return x >>> 0;
}

// ---- small helpers
function fmt(n) {
  const s = String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (n < 0 ? '-$' : '$') + s;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function here(st) { return PLACE[st.loc]; }
function capacity(st) { return CONFIG.baseCap + (st.gear.pouch ? GEAR[st.gear.pouch].cap : 0); }
function used(st) { let n = 0; for (const g of GOODS) n += st.stash[g.id] || 0; return n; }
function free(st) { return capacity(st) - used(st); }
function netWorth(st) { return st.cash + st.bank - st.debt; }
function slotItems(slot) { return Object.keys(GEAR).filter(id => GEAR[id].slot === slot); }
function gearRank(id) { return slotItems(GEAR[id].slot).indexOf(id); }
function canUpgrade(st, id) {
  const cur = st.gear[GEAR[id].slot];
  return !cur || gearRank(id) > gearRank(cur);
}
function guard(st, dmg) { return st.gear.armour ? Math.round(dmg * (1 - GEAR[st.gear.armour].guard)) : dmg; }
function heatUp(st, n) {
  if (n <= 0) return;
  if (st.gear.shades) n = Math.ceil(n / 2);
  st.heat = Math.min(100, st.heat + n);
}
function addLog(st, text, cls) {
  st.logN++;
  st.log.push({ n: st.logN, d: st.day, text, cls: cls || '' });
  if (st.log.length > CONFIG.logMax) st.log.splice(0, st.log.length - CONFIG.logMax);
}
function plural(n, one, many) { return n === 1 ? one : (many || one + 's'); }

// ---- new run
function newGame(opts) {
  opts = opts || {};
  const days = CONFIG.lengths.includes(opts.days) ? opts.days : CONFIG.lengths[0];
  const seed = (opts.seed == null ? 1 : opts.seed) | 0;
  // Count characters, not UTF-16 units, so a cut never splits an emoji in half.
  const name = Array.from(String(opts.name || '').trim()).slice(0, 16).join('') || 'Stray';
  const st = {
    v: 1, version: VERSION, seed, rng: seed, name, days, day: 1, loc: CONFIG.startLoc,
    cash: CONFIG.startCash, bank: 0, debt: CONFIG.startDebt, debtAge: 0,
    hp: CONFIG.maxHp, heat: 0,
    stash: {}, cost: {},
    gear: { pouch: null, weapon: null, armour: null, pawphone: null, mittens: null, shades: null },
    prices: {}, prev: {}, news: null, tip: null, enc: null, over: null,
    log: [], logN: 0,
    stats: { bought: 0, sold: 0, fights: 0, won: 0, fled: 0, busted: 0, peak: CONFIG.startCash - CONFIG.startDebt },
  };
  addLog(st, `Day 1: ${PLACE[st.loc].name}.`, 'day');
  addLog(st, `Welcome to PumaCity, ${name}. Casey Benton owns all of it, including your ${fmt(st.debt)} debt, at 10% a day.`, '');
  addLog(st, `You have ${days} days. Buy low, sell high, and pay her back at PVN Tower.`, '');
  rollMarket(st);
  rollTip(st);
  return st;
}

// ---- prices
function basePrice(st, g, P) {
  const m = (P.mods[g.id] || 1) * (P.all || 1);
  return Math.max(1, Math.round((g.lo + rnd(st) * (g.hi - g.lo)) * m));
}
function basePrices(st, P) {
  const prices = {};
  for (const g of GOODS) prices[g.id] = basePrice(st, g, P);
  const gone = 1 + rndInt(st, 2);
  for (let i = 0; i < gone; i++) prices[pick(st, GOODS).id] = null;
  return prices;
}
function headline(st, g, up) {
  const special = NEWS[g.id] && NEWS[g.id][up ? 'up' : 'down'];
  const line = special && rnd(st) < 0.6 ? special : pick(st, NEWS[up ? 'up' : 'down']);
  return line.replace('{g}', g.name);
}
function rollMarket(st) {
  const P = here(st);
  for (const g of GOODS) if (st.prices[g.id] != null) st.prev[g.id] = st.prices[g.id];
  const tipped = st.tip && st.tip.loc === st.loc && st.tip.day === st.day;
  const prices = tipped ? Object.assign({}, st.tip.prices) : basePrices(st, P);
  st.tip = null;
  st.news = null;
  if (rnd(st) < CONFIG.eventChance) {
    const g = pick(st, GOODS);
    const up = rnd(st) < 0.5;
    const base = prices[g.id] != null ? prices[g.id] : basePrice(st, g, P);
    const [a, b] = up ? CONFIG.eventUp : CONFIG.eventDown;
    prices[g.id] = Math.max(1, Math.round(base * (a + rnd(st) * (b - a))));
    st.news = { good: g.id, up };
    addLog(st, headline(st, g, up), 'news');
  }
  st.prices = prices;
}
/* The Pawphone pre-rolls tomorrow's prices at one other place. If you go there
 * tomorrow, those ARE the prices (a headline can still move one good). */
function rollTip(st) {
  if (!st.gear.pawphone || st.day >= st.days) return;
  const others = PLACES.filter(p => p.id !== st.loc);
  const P = pick(st, others);
  st.tip = { loc: P.id, day: st.day + 1, prices: basePrices(st, P) };
}

// ---- encounters
/* Carrying a big load draws the Watchers' eye, whatever your heat. Valued at
 * each good's usual mid price, so the risk doesn't swing with today's market. */
function carried(st) { let v = 0; for (const g of GOODS) v += (st.stash[g.id] || 0) * (g.lo + g.hi) / 2; return v; }
function carryRisk(st) { return carryRiskWith(st, null, 0); }
/* The load risk if you also carried q more of a good; the screen's buy row
 * shows this before you commit. */
function carryRiskWith(st, id, q) {
  const extra = id ? q * (GOOD[id].lo + GOOD[id].hi) / 2 : 0;
  return Math.min(CONFIG.carryWatchMax, (carried(st) + extra) * CONFIG.carryWatch);
}

function rollEncounter(st) {
  const P = here(st);
  const table = [
    ['goons',    st.debt > 0 && st.debtAge >= CONFIG.goonDays && P.id !== 'pvn' ? 0.3 : 0],
    ['watchers', (0.05 + st.heat / 250 + carryRisk(st)) * P.watch],
    ['rival',    0.07],
    ['boss',     0.035 * (P.boss || 1)],
    ['mugging',  0.04 * (P.mug == null ? 1 : P.mug)],
    ['stash',    0.04],
    ['stray',    0.04],
  ];
  const r = rnd(st);
  let acc = 0;
  for (const [type, p] of table) {
    acc += p;
    if (r < acc) { startEncounter(st, type); return; }
  }
}

/* enc.from marks where this encounter's log lines begin, so the screen can show
 * just them however the encounter was reached (arrival, resume or debug). */
function startEncounter(st, type) {
  const from = st.logN;
  beginEncounter(st, type);
  if (st.enc) st.enc.from = from;
}
function beginEncounter(st, type) {
  switch (type) {
    case 'watchers': {
      const n = clamp(1 + Math.floor(st.heat / 30) + rndInt(st, 2), 1, 5);
      const foes = [];
      if (st.heat >= 40) foes.push({ name: 'Watch-Captain Joyeuse', hp: 24, max: 24 });
      while (foes.length < n) foes.push({ name: 'Watcher', hp: 12, max: 12 });
      st.enc = { type, foes, n, hitP: 0.3, dmg: [3, 8], loot: [80, 250] };
      const lead = foes[0].name === 'Watcher' ? '' : 'Watch-Captain Joyeuse and ';
      const rest = foes.filter(f => f.name === 'Watcher').length;
      addLog(st, n === 1 ? 'A Watcher spots you and gives chase!' : `${lead}${rest} ${plural(rest, 'Watcher')} are on your tail!`, 'enc');
      return;
    }
    case 'rival': {
      const n = 1 + rndInt(st, 3);
      const boss = pick(st, RIVALS);
      const foes = [{ name: boss, hp: 14, max: 14 }];
      while (foes.length < n) foes.push({ name: 'Henchcat', hp: 10, max: 10 });
      const hostile = rnd(st) < 0.45;
      const deal = hostile ? null : makeDeal(st);
      st.enc = { type, foes, n, hostile, deal, boss, hitP: 0.28, dmg: [3, 7], loot: [150, 600] };
      if (hostile) addLog(st, `${boss}'s crew jumps you! "This is our turf."`, 'enc');
      else addLog(st, `${boss} waves you into a doorway. "Got a deal for you."`, 'enc');
      return;
    }
    case 'boss': {
      const sk = st.stash.skooma || 0;
      if (sk > 0 && rnd(st) < 0.6) {
        const price = Math.round(GOOD.skooma.hi * (1.05 + rnd(st) * 0.3));
        st.enc = { type, ask: 'skooma', qty: sk, price };
        addLog(st, `Casey Benton's limo pulls up and a tinted window slides down. "I hear you're carrying Skooma. I'll take all ${sk} at ${fmt(price)} each. Between friends."`, 'enc');
      } else if (st.heat >= 15) {
        const amount = Math.max(300, Math.round(((st.cash + st.bank) * 0.06 + st.heat * 30) / 50) * 50);
        st.enc = { type, ask: 'bribe', amount };
        addLog(st, `Casey Benton's limo pulls up and a tinted window slides down. "The Watchers have been asking about you. For ${fmt(amount)}, they could stop asking."`, 'enc');
      } else {
        addLog(st, "Casey Benton's motorcade sweeps past. You keep your head down.", 'dim');
      }
      return;
    }
    case 'goons': {
      const demand = Math.min(st.debt, Math.max(500, Math.round(st.debt * 0.25)));
      st.enc = { type, demand };
      addLog(st, `Two of The Boss's goons step out of a car. "The Boss hasn't seen her money in a while. ${fmt(demand)}. Now."`, 'enc');
      return;
    }
    case 'stray': {
      const next = ['pouch', 'weapon'].map(slot => slotItems(slot).find(id => canUpgrade(st, id))).filter(Boolean);
      if (!next.length) { addLog(st, 'A scruffy stray looks you over, decides you have everything, and wanders off.', 'dim'); return; }
      const item = pick(st, next);
      const price = Math.round(GEAR[item].price * (0.4 + rnd(st) * 0.2));
      st.enc = { type, item, price };
      addLog(st, `A scruffy stray sidles up. "Psst. Want ${GEAR[item].a} ${GEAR[item].name}? Fell off a hover-truck. ${fmt(price)}, no questions."`, 'enc');
      return;
    }
    case 'stash': {
      const g = GOODS[rndInt(st, 6)];
      const q = Math.min(3 + rndInt(st, 13), free(st));
      if (q <= 0) addLog(st, `You find a bag of ${g.name}, but you have no room to carry it.`, 'dim');
      else { st.stash[g.id] = (st.stash[g.id] || 0) + q; addLog(st, `You find ${q} ${g.name} stuffed in a drainpipe!`, 'good'); }
      return;
    }
    case 'mugging': {
      if (st.cash <= 0) { addLog(st, 'A mugger corners you, finds empty pockets, and leaves in disgust.', 'dim'); return; }
      const lose = Math.max(1, Math.round(st.cash * (0.15 + rnd(st) * 0.25)));
      st.cash -= lose;
      addLog(st, st.loc === 'convention' ? `A pickpocket in the crowd lifts ${fmt(lose)}!` : `You're mugged in an alley! They take ${fmt(lose)}.`, 'bad');
      return;
    }
  }
}

function makeDeal(st) {
  const held = GOODS.filter(g => (st.stash[g.id] || 0) > 0);
  if (held.length && rnd(st) < 0.5) {
    const g = pick(st, held);
    const mkt = st.prices[g.id] != null ? st.prices[g.id] : (g.lo + g.hi) / 2;
    return { side: 'buy', good: g.id, qty: st.stash[g.id], price: Math.round(mkt * (1.2 + rnd(st) * 0.3)) };
  }
  const g = pick(st, GOODS);
  const mkt = st.prices[g.id] != null ? st.prices[g.id] : (g.lo + g.hi) / 2;
  return { side: 'sell', good: g.id, qty: 5 + rndInt(st, 21), price: Math.max(1, Math.round(mkt * (0.5 + rnd(st) * 0.2))) };
}
/* How many units the rival's offer would actually move, given room, cash and stock. */
function dealQty(st, deal) {
  if (deal.side === 'buy') return Math.min(deal.qty, st.stash[deal.good] || 0);
  return Math.max(0, Math.min(deal.qty, free(st), Math.floor(st.cash / deal.price)));
}

function encOptions(st) {
  const e = st.enc;
  const armed = !!st.gear.weapon;
  switch (e.type) {
    case 'watchers': return ['run'].concat(armed ? ['fight'] : [], ['surrender']);
    case 'rival':
      if (e.hostile) return ['run'].concat(armed ? ['fight'] : [], ['surrender']);
      return (dealQty(st, e.deal) > 0 ? ['deal'] : []).concat(['leave'], armed ? ['fight'] : []);
    case 'boss': return e.ask === 'skooma' ? ['sell', 'decline'] : (st.cash >= e.amount ? ['pay'] : []).concat(['refuse']);
    case 'goons': return (st.cash >= e.demand ? ['pay'] : []).concat(['refuse']);
    case 'stray': return (st.cash >= e.price && canUpgrade(st, e.item) ? ['buy'] : []).concat(['decline']);
  }
  return [];
}

function die(st, why) {
  st.hp = 0;
  st.enc = null;
  st.over = { reason: 'dead', why, score: 0, net: netWorth(st), day: st.day };
  addLog(st, `${why} Your run ends on day ${st.day}.`, 'bad');
}

/* Rank-and-file foes read as 'a Watcher'; named ones as themselves. */
function foeName(f) { return /^(Watcher|Henchcat)$/.test(f.name) ? 'a ' + f.name : f.name; }

function foesStrike(st) {
  const e = st.enc;
  let total = 0;
  for (let i = 0; i < e.foes.length; i++) if (rnd(st) < e.hitP) total += rndRange(st, e.dmg[0], e.dmg[1]);
  if (total > 0) {
    total = Math.max(1, guard(st, total));
    st.hp = Math.max(0, st.hp - total);
    addLog(st, `They hit you for ${total} HP.`, 'bad');
  } else {
    addLog(st, 'They swing and miss.', 'dim');
  }
  if (st.hp <= 0) die(st, e.type === 'watchers' ? 'The Watchers take you down.' : `${e.boss}'s crew takes you down.`);
}

function winFight(st) {
  const e = st.enc;
  let cash = 0;
  for (let i = 0; i < e.n; i++) cash += rndRange(st, e.loot[0], e.loot[1]);
  st.cash += cash;
  st.stats.won++;
  heatUp(st, e.type === 'watchers' ? 15 : 6);
  addLog(st, `${e.type === 'watchers' ? 'The Watchers are down' : `${e.boss}'s crew is down`}. You go through their pockets: ${fmt(cash)}.`, 'good');
  st.enc = null;
}

/* The odds and costs an encounter choice carries. The screen shows exactly
 * these numbers beside the buttons, and the actions below use them, so what
 * a choice says it will cost is what it costs. */
function runChance(st) { return clamp(0.55 + (st.gear.mittens ? 0.25 : 0) - 0.05 * st.enc.foes.length, 0.15, 0.9); }
function giveUpCost(st) {
  const held = used(st);
  if (st.enc.type === 'watchers') return { units: held, cash: Math.round(st.cash * (held > 0 ? 0.25 : 0.1)), all: true };
  if (held > 0) { let units = 0; for (const g of GOODS) units += Math.ceil((st.stash[g.id] || 0) / 2); return { units, cash: 0, all: false }; }
  return { units: 0, cash: Math.round(st.cash * 0.3), all: false };
}
function goonTake(st) { return Math.min(st.debt, Math.round(st.cash * 0.2)); }

const ENC = {
  run(st) {
    const e = st.enc;
    const p = runChance(st);
    if (rnd(st) < p) {
      st.stats.fled++;
      addLog(st, 'You slip away down an alley.', 'good');
      st.enc = null;
      return;
    }
    const lost = dropGoods(st, CONFIG.dropOnFail);
    addLog(st, lost ? `You can't shake them, and ${lost} ${plural(lost, 'unit')} of your load spill${lost === 1 ? 's' : ''} in the scramble!` : "You can't shake them!", 'bad');
    foesStrike(st);
  },
  fight(st) {
    const e = st.enc;
    const W = GEAR[st.gear.weapon];
    if (e.type === 'rival' && !e.hostile) {
      e.hostile = true;
      e.deal = null;
      addLog(st, `You go for ${e.boss}. The deal's off!`, 'enc');
    }
    if (!e.fought) { e.fought = true; st.stats.fights++; }
    const f = e.foes[e.foes.length - 1];
    if (rnd(st) < 0.75) {
      const d = rndRange(st, W.dmg[0], W.dmg[1]);
      f.hp -= d;
      if (f.hp <= 0) { e.foes.pop(); addLog(st, `You take down ${foeName(f)} with your ${W.name}!`, 'good'); }
      else addLog(st, `You hit ${foeName(f)} for ${d}.`, '');
    } else {
      addLog(st, 'You miss!', 'dim');
    }
    if (!e.foes.length) { winFight(st); return; }
    foesStrike(st);
  },
  surrender(st) {
    const e = st.enc;
    const held = used(st);
    const cost = giveUpCost(st);
    if (e.type === 'watchers') {
      st.stats.busted++;
      const fine = cost.cash;
      st.cash -= fine;
      if (held > 0) addLog(st, `You put your paws up. The Watchers confiscate your whole stash (${held} ${plural(held, 'unit')}) and fine you ${fmt(fine)}.`, 'bad');
      else addLog(st, `You put your paws up. You're clean, but they fine you ${fmt(fine)} for loitering.`, 'bad');
      st.stash = {};
      st.cost = {};
      st.heat = Math.min(st.heat, 10);
    } else if (held > 0) {
      let took = 0;
      for (const g of GOODS) {
        const q = st.stash[g.id] || 0;
        if (!q) continue;
        const t = Math.ceil(q / 2);
        took += t;
        takeGoods(st, g.id, t);
      }
      addLog(st, `You hand it over. ${e.boss}'s crew walks off with ${took} ${plural(took, 'unit')} of your stash.`, 'bad');
    } else {
      const lose = cost.cash;
      st.cash -= lose;
      addLog(st, `Your pouch is empty, so ${e.boss} takes ${fmt(lose)} instead.`, 'bad');
    }
    st.enc = null;
  },
  deal(st) {
    const e = st.enc;
    const d = e.deal;
    const g = GOOD[d.good];
    const q = dealQty(st, d);
    if (d.side === 'buy') {
      takeGoods(st, g.id, q);
      st.cash += q * d.price;
      st.stats.sold += q * d.price;
      addLog(st, `You sell ${e.boss} ${q} ${g.name} at ${fmt(d.price)}.`, 'trade');
    } else {
      st.cash -= q * d.price;
      st.stash[g.id] = (st.stash[g.id] || 0) + q;
      st.cost[g.id] = (st.cost[g.id] || 0) + q * d.price;
      st.stats.bought += q * d.price;
      addLog(st, `You buy ${q} ${g.name} from ${e.boss} at ${fmt(d.price)}.`, 'trade');
    }
    st.enc = null;
  },
  leave(st) {
    addLog(st, `You tell ${st.enc.boss} you'll pass.`, 'dim');
    st.enc = null;
  },
  sell(st) {
    const e = st.enc;
    const q = Math.min(e.qty, st.stash.skooma || 0);
    takeGoods(st, 'skooma', q);
    st.cash += q * e.price;
    st.stats.sold += q * e.price;
    addLog(st, `The Boss takes ${q} Skooma off your paws for ${fmt(q * e.price)}. The window slides up.`, 'good');
    st.enc = null;
  },
  decline(st) {
    if (st.enc.type === 'boss') addLog(st, '"Pity." The window slides up.', 'dim');
    else addLog(st, 'The stray shrugs and vanishes.', 'dim');
    st.enc = null;
  },
  pay(st) {
    const e = st.enc;
    if (e.type === 'boss') {
      st.cash -= e.amount;
      st.heat = 0;
      addLog(st, `You hand over ${fmt(e.amount)}. "Pleasure." The Watchers lose interest in you.`, 'good');
    } else {
      st.cash -= e.demand;
      st.debt -= e.demand;
      st.debtAge = 0;
      addLog(st, `You pay the goons ${fmt(e.demand)} toward your debt. They drive off.`, 'warn');
    }
    st.enc = null;
  },
  refuse(st) {
    const e = st.enc;
    if (e.type === 'boss') {
      st.heat = Math.min(100, st.heat + 20);
      addLog(st, '"Suit yourself." The window rolls up. The Watchers will be keen now.', 'bad');
      st.enc = null;
      return;
    }
    const dmg = Math.max(1, guard(st, rndRange(st, 12, 28)));
    const take = goonTake(st);
    st.hp = Math.max(0, st.hp - dmg);
    st.cash -= take;
    st.debt -= take;
    st.debtAge = CONFIG.goonDays - 4;
    st.enc = null;
    addLog(st, `The goons rough you up (${dmg} HP)${take ? ` and take ${fmt(take)} toward the debt` : ''}. "We'll be back."`, 'bad');
    if (st.hp <= 0) die(st, "The Boss's goons go too far.");
  },
  buy(st) {
    const e = st.enc;
    const it = GEAR[e.item];
    st.cash -= e.price;
    st.gear[it.slot] = e.item;
    addLog(st, `You buy the ${it.name} for ${fmt(e.price)}. Bargain.`, 'good');
    st.enc = null;
  },
};

/* A failed getaway costs a share of everything carried, rounded down, so a
 * light load can come through untouched. Returns the units lost. */
function dropGoods(st, share) {
  let lost = 0;
  if (share <= 0) return 0;
  for (const g of GOODS) {
    const q = Math.floor((st.stash[g.id] || 0) * share);
    if (q > 0) { takeGoods(st, g.id, q); lost += q; }
  }
  return lost;
}

function takeGoods(st, id, q) {
  const have = st.stash[id] || 0;
  if (q <= 0 || have <= 0) return;
  const basis = st.cost[id] || 0;
  st.cost[id] = basis - Math.round(basis * q / have);
  st.stash[id] = have - q;
  if (!st.stash[id]) { delete st.stash[id]; delete st.cost[id]; }
}

// ---- market actions
function sellableHere(st) { return GOODS.filter(g => (st.stash[g.id] || 0) > 0 && st.prices[g.id] != null); }
function intAmt(v) { const n = Math.floor(Number(v)); return Number.isFinite(n) ? n : 0; }

const MARKET = {
  buy(st, a) {
    const g = GOOD[a.good];
    if (!g) return 'Unknown good.';
    const p = st.prices[g.id];
    if (p == null) return `Nobody is selling ${g.name} here today.`;
    const q = intAmt(a.qty);
    if (q < 1) return 'Buy at least one.';
    if (q > free(st)) return `Your pouch only has room for ${free(st)} more.`;
    if (q * p > st.cash) return `You can't afford ${q} ${g.name}.`;
    st.cash -= q * p;
    st.stash[g.id] = (st.stash[g.id] || 0) + q;
    st.cost[g.id] = (st.cost[g.id] || 0) + q * p;
    st.stats.bought += q * p;
    addLog(st, `Bought ${q} ${g.name} at ${fmt(p)}.`, 'trade');
  },
  sell(st, a) {
    const g = GOOD[a.good];
    if (!g) return 'Unknown good.';
    const p = st.prices[g.id];
    if (p == null) return `Nobody is buying ${g.name} here today.`;
    const q = intAmt(a.qty);
    const have = st.stash[g.id] || 0;
    if (q < 1) return 'Sell at least one.';
    if (q > have) return `You only have ${have} ${g.name}.`;
    const value = q * p;
    takeGoods(st, g.id, q);
    st.cash += value;
    st.stats.sold += value;
    heatUp(st, Math.min(8, Math.floor(value / 4000)));
    addLog(st, `Sold ${q} ${g.name} at ${fmt(p)}.`, 'trade');
  },
  /* Sells every good you hold that someone here is buying, each at today's
   * price and through the same rule as a single sale (so heat adds up the
   * same way). Goods nobody here is buying stay in the pouch. */
  sellall(st) {
    const goods = sellableHere(st);
    if (!goods.length) return 'Nobody here is buying anything you carry.';
    for (const g of goods) MARKET.sell(st, { good: g.id, qty: st.stash[g.id] });
  },
  travel(st, a) {
    const P = PLACE[a.to];
    if (!P) return 'No such place.';
    if (P.id === st.loc) return 'You are already here.';
    if (st.day >= st.days) return 'This is your last day. Cash out.';
    st.day++;
    st.loc = P.id;
    if (st.debt > 0) { st.debt = Math.round(st.debt * (1 + CONFIG.debtRate)); st.debtAge++; }
    if (st.bank > 0) st.bank = Math.floor(st.bank * (1 + CONFIG.bankRate));
    st.heat = Math.max(0, st.heat - CONFIG.heatDecay - (P.cool || 0));
    addLog(st, `Day ${st.day}: ${P.name}.`, 'day');
    rollMarket(st);
    rollTip(st);
    rollEncounter(st);
    if (st.day === st.days && !st.over) addLog(st, 'Last day! Sell everything, then cash out. Unsold goods are worth nothing.', 'warn');
  },
  finish(st) {
    if (st.debt > 0) {
      const fromCash = Math.min(st.cash, st.debt);
      st.cash -= fromCash; st.debt -= fromCash;
      const fromBank = Math.min(st.bank, st.debt);
      st.bank -= fromBank; st.debt -= fromBank;
      if (fromCash + fromBank > 0) addLog(st, `The Boss collects ${fmt(fromCash + fromBank)}.`, 'warn');
    }
    const unsold = used(st);
    const score = st.cash + st.bank - st.debt;
    st.over = { reason: 'days', score, unsold, day: st.day };
    if (score < 0) addLog(st, `You still owe The Boss ${fmt(st.debt)}. Leaving town would be wise.`, 'bad');
    addLog(st, `You cash out with ${fmt(score)}.`, score > 0 ? 'good' : 'bad');
  },
  borrow(st, a) {
    const amt = intAmt(a.amt);
    if (amt < 1) return 'Borrow at least $1.';
    if (st.debt + amt > CONFIG.debtCap) return `The Boss won't carry more than ${fmt(CONFIG.debtCap)} for you.`;
    if (st.debt === 0) st.debtAge = 0;
    st.debt += amt;
    st.cash += amt;
    addLog(st, `The Boss lends you ${fmt(amt)}. "Ten percent a day. Don't make me send anyone."`, 'warn');
  },
  repay(st, a) {
    const amt = intAmt(a.amt);
    if (st.debt <= 0) return "You don't owe The Boss anything.";
    if (amt < 1) return 'Repay at least $1.';
    if (amt > st.cash) return "You don't have that much cash on you.";
    if (amt > st.debt) return `You only owe ${fmt(st.debt)}.`;
    if (amt >= st.debt * CONFIG.repayReset) st.debtAge = 0;
    st.debt -= amt;
    st.cash -= amt;
    addLog(st, st.debt === 0 ? `You pay The Boss off in full. "Pleasure doing business."` : `You pay The Boss ${fmt(amt)}. You still owe ${fmt(st.debt)}.`, 'good');
  },
  deposit(st, a) {
    const amt = intAmt(a.amt);
    if (amt < 1) return 'Deposit at least $1.';
    if (amt > st.cash) return "You don't have that much cash on you.";
    st.cash -= amt; st.bank += amt;
    addLog(st, `Deposited ${fmt(amt)}.`, 'trade');
  },
  withdraw(st, a) {
    const amt = intAmt(a.amt);
    if (amt < 1) return 'Withdraw at least $1.';
    if (amt > st.bank) return `You only have ${fmt(st.bank)} in the Vault.`;
    st.bank -= amt; st.cash += amt;
    addLog(st, `Withdrew ${fmt(amt)}.`, 'trade');
  },
  gear(st, a) {
    const it = GEAR[a.item];
    if (!it || !here(st).shop.includes(a.item)) return "That isn't sold here.";
    if (!canUpgrade(st, a.item)) return st.gear[it.slot] === a.item ? `You already have the ${it.name}.` : `You already have something better than the ${it.name}.`;
    if (st.cash < it.price) return `The ${it.name} costs ${fmt(it.price)}.`;
    st.cash -= it.price;
    st.gear[it.slot] = a.item;
    addLog(st, `You buy the ${it.name} for ${fmt(it.price)}.`, 'good');
    if (it.slot === 'pawphone') rollTip(st);
  },
  heal(st) {
    const missing = CONFIG.maxHp - st.hp;
    if (missing <= 0) return 'The vet says you are in perfect health.';
    const hp = Math.min(missing, Math.floor(st.cash / CONFIG.vetPerHp));
    if (hp < 1) return `The vet charges ${fmt(CONFIG.vetPerHp)} per HP.`;
    st.cash -= hp * CONFIG.vetPerHp;
    st.hp += hp;
    addLog(st, `The vet patches you up: +${hp} HP for ${fmt(hp * CONFIG.vetPerHp)}.`, 'good');
  },
};

// ---- the one way in
function waiting(st) {
  if (st.over) return { kind: 'over', options: [] };
  if (st.enc) return { kind: 'encounter', type: st.enc.type, options: encOptions(st) };
  const P = here(st);
  const o = [];
  if (GOODS.some(g => st.prices[g.id] != null)) o.push('buy');
  if (used(st) > 0) o.push('sell');
  if (sellableHere(st).length) o.push('sellall');
  o.push(st.day < st.days ? 'travel' : 'finish');
  if (P.service === 'loan') o.push('borrow', 'repay');
  if (P.service === 'bank') o.push('deposit', 'withdraw');
  if (P.service === 'vet') o.push('heal');
  if (P.shop.length) o.push('gear');
  return { kind: 'market', options: o };
}

/* step(state, action) -> {state, events, refused}. The input state is never
 * modified; a refused action returns it unchanged along with the reason. */
function step(st0, a) {
  const w = waiting(st0);
  if (!a || !w.options.includes(a.t)) {
    return { state: st0, events: [], refused: w.kind === 'over' ? 'The run is over.' : `You can't do that right now.` };
  }
  const st = JSON.parse(JSON.stringify(st0));
  const n0 = st.logN;
  const fn = (w.kind === 'encounter' ? ENC : MARKET)[a.t];
  const err = fn(st, a);
  if (typeof err === 'string') return { state: st0, events: [], refused: err };
  if (!st.over) st.stats.peak = Math.max(st.stats.peak, netWorth(st));
  return { state: st, events: st.log.filter(l => l.n > n0), refused: null };
}

/* For the debug hook and the tests: the same state with a given encounter started. */
function forceEncounter(st0, type) {
  const st = JSON.parse(JSON.stringify(st0));
  st.enc = null;
  startEncounter(st, type);
  return st;
}

// ---- bot: plays through the same door. Pure: it reads the state and never
// advances st.rng, so a bot's thinking cannot change what happens next.
function ratio(g, p) { return (p - g.lo) / (g.hi - g.lo); }
function botAct(st, style) {
  style = style || 'careful';
  const w = waiting(st);
  if (w.kind === 'over') return null;
  const has = t => w.options.includes(t);
  if (w.kind === 'encounter') {
    const e = st.enc;
    switch (e.type) {
      case 'watchers':
      case 'rival':
        if (e.type === 'rival' && !e.hostile) {
          if (has('deal') && (e.deal.side === 'buy' || ratio(GOOD[e.deal.good], e.deal.price) < 0.3)) return { t: 'deal' };
          return { t: 'leave' };
        }
        if (has('fight') && (style === 'reckless' || st.hp > 50)) return { t: 'fight' };
        if (style !== 'reckless' && st.hp < 25) return { t: 'surrender' };
        return { t: 'run' };
      case 'boss':
        if (e.ask === 'skooma') return { t: 'sell' };
        return has('pay') && st.heat >= 30 && st.cash >= e.amount * 2 ? { t: 'pay' } : { t: 'refuse' };
      case 'goons': return has('pay') ? { t: 'pay' } : { t: 'refuse' };
      case 'stray': return has('buy') && st.cash >= e.price * 2 ? { t: 'buy' } : { t: 'decline' };
    }
  }
  const P = here(st);
  const last = st.day === st.days;
  for (const g of GOODS) {
    const q = st.stash[g.id] || 0;
    const p = st.prices[g.id];
    if (q > 0 && p != null && (last || ratio(g, p) >= 0.6)) return { t: 'sell', good: g.id, qty: q };
  }
  if (last) return { t: 'finish' };
  if (P.service === 'loan' && st.debt > 0 && st.cash > 500) return { t: 'repay', amt: st.cash >= st.debt ? st.debt : st.cash - 500 };
  if (P.service === 'bank') {
    if (st.cash > 40000) return { t: 'deposit', amt: st.cash - 20000 };
    if (st.cash < 3000 && st.bank > 0) return { t: 'withdraw', amt: Math.min(st.bank, 20000) };
  }
  if (P.service === 'vet' && st.hp < 60 && st.cash > (CONFIG.maxHp - st.hp) * CONFIG.vetPerHp * 3) return { t: 'heal' };
  for (const id of P.shop) {
    const it = GEAR[id];
    if (['pouch', 'weapon', 'armour'].includes(it.slot) && canUpgrade(st, id) && st.cash >= it.price * 3) return { t: 'gear', item: id };
  }
  const reserve = Math.min(500, Math.floor(st.cash * 0.05));
  let best = null;
  let bestR = 0.35;
  for (const g of GOODS) {
    const p = st.prices[g.id];
    if (p == null) continue;
    const q = Math.min(free(st), Math.floor((st.cash - reserve) / p));
    const r = ratio(g, p);
    if (q >= 1 && r < bestR) { best = { good: g.id, qty: q }; bestR = r; }
  }
  if (best) return { t: 'buy', good: best.good, qty: best.qty };
  const others = PLACES.filter(p => p.id !== st.loc);
  let to = others[hash32(st.rng ^ Math.imul(st.day, 7919)) % others.length].id;
  if (st.debt > 0 && st.cash >= st.debt && st.loc !== 'pvn') to = 'pvn';
  else if (st.hp < 50 && st.cash > 1500 && st.loc !== 'suburbs') to = 'suburbs';

/* ---------------------------------------------------------------------------
 * The screen. Everything below talks to the core only through newGame, step,
 * waiting and the read-only helpers.
 * ------------------------------------------------------------------------- */
const KEY_GAME = 'pumacity_game_v1';
const KEY_SCORES = 'pumacity_scores_v1';
const KEY_PREFS = 'pumacity_prefs_v1';

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function save(key, value) {
  try { if (value == null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private window */ }
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const root = document.querySelector('[data-pumacity-game]');

/* A save from an older build, or one edited by hand, must not crash the screen:
 * anything that doesn't look like a live run is treated as no save at all. */
function validSave(st) {
  return !!st && st.v === 1 && !st.over && PLACE[st.loc] && CONFIG.lengths.includes(st.days)
    && Number.isInteger(st.day) && st.day >= 1 && st.day <= st.days
    && ['cash', 'bank', 'debt', 'hp', 'heat', 'rng', 'logN'].every(k => Number.isFinite(st[k]))
    && st.stash && st.cost && st.gear && st.prices && st.prev && st.stats && Array.isArray(st.log)
    && (st.enc == null || typeof st.enc.type === 'string');
}
function loadGame() {
  const st = load(KEY_GAME, null);
  return validSave(st) ? st : null;
}

function scores() {
  const s = load(KEY_SCORES, {});
  return s && typeof s === 'object' ? s : {};
}
function recordScore(st) {
  const all = scores();
  const list = Array.isArray(all[st.days]) ? all[st.days] : [];
  const entry = { name: st.name, score: st.over.score, dead: st.over.reason === 'dead', day: st.over.day, at: new Date().toISOString().slice(0, 10), id: st.seed + ':' + st.logN };
  list.push(entry);
  list.sort((a, b) => b.score - a.score);
  all[st.days] = list.slice(0, 10);
  save(KEY_SCORES, all);
  return all[st.days].findIndex(e => e.id === entry.id);
}

/* First-run coach: two steps (buy something cheap, then travel), shown once
 * ever. Anyone who already has a finished run on the board is no newcomer. */
if (prefs.coachDone == null) {
  const all = scores();
  prefs.coachDone = Object.keys(all).some(k => Array.isArray(all[k]) && all[k].length > 0);
}
function coachStep(a) {
  if (prefs.coachDone || !a) return;
  if (a.t === 'buy' && !S.enc) prefs.coachTraded = true;
  if (a.t === 'travel') prefs.coachTravelled = true;
  if (prefs.coachTraded && prefs.coachTravelled) prefs.coachDone = true;
  save(KEY_PREFS, prefs);
}

// ---- actions
const TRADES = ['buy', 'sell', 'sellall', 'deal'];
function act(a) {
  if (!S) return;
  const before = S;
  const r = step(S, a);
  if (r.refused) { ui.flash = r.refused; announce([r.refused]); render(); return; }
  S = r.state;
  ui.flash = '';
  announce(r.events.map(l => l.text));
  // A trade gets a beat: the cash moves, and the rows that changed light up.
  coachStep(a);
  if (a && TRADES.includes(a.t) && S.cash !== before.cash) {
    ui.fx = { from: before.cash, to: S.cash, rows: GOODS.map((g, i) => (S.stash[g.id] || 0) !== (before.stash[g.id] || 0) ? i : -1).filter(i => i >= 0) };
  }
  if (S.over && !before.over) {
    ui.rank = recordScore(S);
    save(KEY_GAME, null);
    ui.modal = { kind: 'over' };
  } else {
    save(KEY_GAME, S);
  }
  if (a.t === 'travel') ui.arrived = true;
  if (a.t === 'travel' || a.t === 'finish') ui.modal = S.over ? { kind: 'over' } : null;
  if (['buy', 'sell', 'sellall', 'travel', 'finish'].includes(a.t)) { ui.trade = null; ui.side = null; ui.confirmCash = false; }
  render();
}

function startRun() {
  const nameEl = document.getElementById('pc-name');
  if (nameEl) prefs.name = Array.from(nameEl.value.trim()).slice(0, 16).join('');
  save(KEY_PREFS, prefs);
  const seed = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) | 0;
  S = newGame({ seed, days: prefs.days, name: prefs.name });
  ui = { sel: 0, modal: null, flash: '' };
  save(KEY_GAME, S);
  render();
}

function resume() {
  S = loadGame();
  ui = { sel: 0, modal: null, flash: '' };
  render();
}

function quitToTitle() {
  S = null;
  ui = { sel: 0, modal: null, flash: '' };
  render();
}

      const t = x / 1600, y = (1 - t) * (1 - t) * 700 + 2 * (1 - t) * t * 560 + t * t * 700;
      o += `<path class="sd" d="M${x} ${(y + 8).toFixed(0)} V${G}"/>`;
    }
    for (const x of [50, 130, 210, 1390, 1470, 1550]) {
      o += `<path class="sl" d="M${x} ${G} V420"/><path class="sl" d="M${x} 420 L${x + 26} 428 L${x} 436"/>`;
      o += `<path class="sf" d="M${x + 4} 452 H${x + 34} V600 L${x + 19} 586 L${x + 4} 600 Z"/><path class="${rint(x, 2) ? 'sa' : 'swl'}" d="M${x + 4} 470 H${x + 34}"/>`;
    }
    o += `<text class="stx" x="130" y="680" text-anchor="middle">EXPO</text><text class="stx" x="1470" y="680" text-anchor="middle">EXPO</text>`;
    return o;
  },
  suburbs() {
    let o = stars(83, 100, 380) + moon(160, 100);
    // Casey's tower on the skyline: you live in her city
    o += `<path class="sf" d="M1446 760 V420 H1500 V760 Z"/><path class="sa" d="M1442 416 H1504"/>` + grid(1455, 440, 3, 9, 8, 10, 8, 18, 61, 30);
    for (let x = 340; x < 1260; x += 116) o += house(x, 790, 90, 44, x, { garage: rint(x, 2) });
    o += house(20, 850, 250, 150, 7, { garage: true }) + rentSign(300, 850);
    o += `<rect class="sf" x="120" y="708" width="54" height="30"/><path class="sl" d="M135 740 q12 12 24 0"/>`;
    o += house(1340, 850, 240, 140, 13) + rentSign(1300, 850);
    o += tree(1196, 40, 850) + lamp(440, 230, 1) + lamp(1110, 230, -1);
    o += `<path class="sl" d="M0 852 H1600M0 872 H1600"/>`;
    return o;
  },
};

const sceneCache = {};
function sceneSVG(id) {
  if (!sceneCache[id]) {
    sceneCache[id] = `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
<defs><linearGradient id="pcb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb000" stop-opacity=".16"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></linearGradient>
<linearGradient id="pcc" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#54f2ff" stop-opacity=".12"/><stop offset="1" stop-color="#54f2ff" stop-opacity="0"/></linearGradient></defs>
${id === 'vault' ? '' : `<rect class="sground" x="0" y="${G}" width="1600" height="${900 - G}"/>`}${SCENES[id]()}</svg>`;
  }
  return sceneCache[id];
}

/* Crossfades to the new district's scene. The old layer is removed after the
 * fade, so at most two are ever in the DOM. */
const sceneEl = document.getElementById('pc-scene');
let sceneNow = null;
function setScene(id) {
  if (!sceneEl || id === sceneNow) return;
  sceneNow = id;
  sceneEl.classList.toggle('under', id === 'vault');
  const layer = document.createElement('div');
  layer.className = 'layer';
  layer.innerHTML = sceneSVG(id);
  sceneEl.appendChild(layer);
  const old = [...sceneEl.children].filter(c => c !== layer);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    layer.classList.add('on');
    for (const c of old) c.classList.remove('on');
    setTimeout(() => old.forEach(c => c.remove()), 900);
  }));
}

/* Where a price sits in its good's usual range. The word carries the meaning;
 * the marker and colour only reinforce it. */
function priceStanding(g, p) {
  const r = (p - g.lo) / (g.hi - g.lo);
  const word = r < 0 ? 'bargain' : r < 0.33 ? 'cheap' : r < 0.67 ? 'fair' : r <= 1 ? 'steep' : 'sky-high';
  return { r, word };
}
function coachHTML(st) {
  if (prefs.coachDone || st.enc || st.over) return '';
  let tip;
  if (!prefs.coachTraded) {
    const buyable = GOODS.map((g, i) => ({ g, i, p: st.prices[g.id] })).filter(x => x.p != null && x.p <= st.cash);
    if (!buyable.length) return '';
    const best = buyable.reduce((a, b) => priceStanding(b.g, b.p).r < priceStanding(a.g, a.p).r ? b : a);
    tip = `${best.g.name} is ${priceStanding(best.g, best.p).word} here. Press <kbd>${best.i + 1}</kbd> then <kbd>B</kbd> to buy some, or tap its Buy button.`;
  } else {
    tip = `Now travel (<kbd>T</kbd>) and sell wherever it shows <span class="rw steep">steep</span>. Every trip takes a day, and the debt grows overnight.`;
  }
  return `<p class="coach"><b>First run</b> <span>${tip}</span><button class="link" data-act="coachoff">Got it</button></p>`;
}

function headlineToday(st) {
  if (!st.news) return '';
  const line = [...st.log].reverse().find(l => l.cls === 'news' && l.d === st.day);
  return line ? `<p class="ticker"><b>News</b> ${esc(line.text)}</p>` : '';
}
function rangeCell(g, p) {
  if (p == null) return '<span class="dim">not here today</span>';
  const { r, word } = priceStanding(g, p);
  const x = Math.round(clamp(r, -0.08, 1.08) * 100);
  return `<span class="track" aria-hidden="true"><i style="left:${x}%"></i></span><span class="rw ${word}">${word}</span>`;
}
const HEAT = [
  [0, 'cool', 'The Watchers barely notice you.'],
  [20, 'warm', 'The Watchers are starting to ask about you.'],
  [40, 'hot', 'Watch-Captain Joyeuse is on your case.'],
  [70, 'wanted', 'Every patrol in PumaCity knows your face.'],
];
function heatBand(h) { let b = HEAT[0]; for (const x of HEAT) if (h >= x[0]) b = x; return { word: b[1], effect: b[2] }; }
/* The load note mirrors the goon countdown: quiet while the risk is small,
 * then warning, then danger, at the same thresholds the buy row uses. */
const RISK_SHOW = 0.02;  // below this the load's pull is noise, so it isn't shown
function riskClass(r) { return r >= 0.2 ? 'bad' : r >= 0.08 ? 'warn' : ''; }
function loadLevel(st) { const c = riskClass(carryRisk(st)); return c ? ' ' + c : ''; }
function loadNote(st) {
  const r = carryRisk(st);
  return r < RISK_SHOW ? '' : `<em>Watchers +${Math.round(r * 100)}%</em>`;
}
function debtNote(st) {
  if (st.debt <= 0) return 'paid off';
  const n = CONFIG.goonDays - st.debtAge;
  return n <= 0 ? 'goons: any day now' : `goons in ${n} ${plural(n, 'day')}`;
}

function gameHTML() {

      : ' <span class="tr" aria-hidden="true"> </span>';

      else { const pct = Math.round((p - each) / each * 100); pl = pct === 0 ? ' <span class="dim">even</span>' : ` <span class="${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '+' : '−'}${Math.abs(pct)}%</span>`; }

    `${g.name} ${st.tip.prices[g.id] == null ? '—' : fmt(st.tip.prices[g.id])}`).join(' · ')}</div>` : '';
  const log = st.log.map(l => `<p class="${l.cls}">${esc(l.text)}</p>`).join('');
  const left = st.days - st.day;
  const sellable = sellableHere(st).length > 0;
  return `<div class="pc">
  <header class="top">
    <h1 class="place-name">${P.name}</h1>
    <span class="day${last ? ' last' : ''}">${last ? 'Last day' : `Day <b>${st.day}</b> of ${st.days} · ${left} left`}</span>
    <span class="grow"></span><span class="brand">PumaCity</span>
  </header>
  <div class="dayline${last ? ' last' : ''}"><i style="width:${Math.round(st.day / st.days * 100)}%"></i></div>
  <div class="status">
    <div class="stat lead cash"><small>Cash</small><span>${fmt(st.cash)}</span></div>
    <div class="stat lead${st.debt > 0 ? (st.debtAge >= CONFIG.goonDays - 2 ? ' bad' : ' warn') : ''}"><small>Debt</small><span>${fmt(st.debt)}</span><em>${debtNote(st)}</em></div>
    <div class="stat"><small>Bank</small><span>${fmt(st.bank)}</span></div>
    <div class="stat${st.hp <= 30 ? ' bad' : ''}"><small>Health</small><span>${st.hp} / ${CONFIG.maxHp}</span>${meter(st.hp, CONFIG.maxHp, st.hp <= 30 ? 'low' : '')}</div>
    <div class="stat${loadLevel(st)}" title="A heavy load draws the Watchers: up to +${Math.round(CONFIG.carryWatchMax * 100)}% a day, whatever your heat."><small>Pouch</small><span>${u} / ${cap}</span>${meter(u, cap, 'heat')}${loadNote(st)}</div>
    <div class="stat${st.heat >= 40 ? ' bad' : ''}" title="${heatBand(st.heat).effect}${carryRisk(st) >= RISK_SHOW ? ` Your load adds about +${Math.round(carryRisk(st) * 100)}% a day on top.` : ''}"><small>Heat</small><span>${heatBand(st.heat).word} · ${st.heat}</span>${meter(st.heat, 100, st.heat >= 40 ? 'low' : 'heat')}</div>
  </div>
  <div class="main">
    <section class="market">
      ${coachHTML(st)}
      ${headlineToday(st)}
      <table class="mk"><thead><tr><th class="key"></th><th class="name">Good</th><th>Price</th><th class="range">vs usual</th><th class="held">Held</th><th></th></tr></thead>
      <tbody>${goods}</tbody></table>
      ${ui.side === 'service' ? '' : `<div class="flash" role="status">${esc(ui.flash)}</div>`}
      ${ui.confirmCash ? `<p class="confirm-note">Cashing out ends the run. The Boss collects what you owe${u ? `, and the ${u} ${plural(u, 'unit')} you still hold are worth nothing` : ''}.</p>` : ''}
      <nav class="bar">
        ${last && ui.confirmCash ? '<button class="danger" data-act="finishconfirm"><kbd>E</kbd>Confirm cash out</button><button data-act="finishcancel"><kbd>Esc</kbd>Not yet</button>'

          : last ? '<button class="primary" data-act="finish"><kbd>E</kbd>Cash out</button>'

        ${svc && !last ? `<button data-act="service"><kbd>V</kbd>${esc(P.serviceName)}</button>` : ''}

    <aside class="side">
      ${ui.side === 'travel' ? travelPanelHTML() : ui.side === 'service' ? servicePanelHTML() : `<div class="place">
        <p class="spec">${P.special}</p>
        <p class="blurb">${P.blurb}</p>
        ${gearBlock}
        ${tip}
      </div>
      <div class="logwrap"><div class="log" id="pc-log" tabindex="0" aria-label="Log">${log}</div></div>`}
    </aside>
  </div>
</div>`;
}

// ---- modals
function modalHTML() {
  const m = ui.modal;
  if (S && S.over) return overHTML();
  if (S && S.enc) return encHTML();
  if (!m) return '';
  let body = '';
  switch (m.kind) {
    case 'help': body = helpHTML(m.tab || 'basics'); break;
    case 'menu': body = menuHTML(); break;
    case 'confirmNew': body = `<h1 id="pc-mt">Abandon this run?</h1><p>Your current run will not be scored.</p>
      <div class="acts"><button class="danger" data-act="newconfirm"><kbd>Y</kbd>Abandon and start over</button><button data-act="close"><kbd>Esc</kbd>Keep playing</button></div>`; break;
  }
  return `<div class="back" data-act="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pc-mt">${body}</div></div>`;
}

function qtyMax(m) {
  const g = GOODS[m.good];
  const p = S.prices[g.id];
  if (m.side === 'buy') return p ? Math.max(0, Math.min(free(S), Math.floor(S.cash / p))) : 0;
  return S.stash[g.id] || 0;
}
function riskAfterText(t) {
  const g = GOODS[t.good];
  const now = carryRisk(S), after = carryRiskWith(S, g.id, intAmt(t.qty) || 0);
  if (after < RISK_SHOW) return '';
  const cls = riskClass(after);
  const pct = x => Math.round(x * 100);
  if (after - now < 0.005) {
    return after >= CONFIG.carryWatchMax
      ? `<span class="${cls}">Your load already draws the Watchers as hard as it can: about +${pct(after)}% a day.</span>`
      : `<span class="${cls}">Barely changes the Watcher odds: about +${pct(after)}% a day.</span>`;
  }
  const capped = after >= CONFIG.carryWatchMax ? ', the most it gets' : '';
  return `<span class="${cls}">After this, your load draws the Watchers: about +${pct(after)}% a day${capped}${now >= RISK_SHOW ? `, up from +${pct(now)}%` : ''}.</span>`;
}

function tradeRowHTML(t) {
  const g = GOODS[t.good];
  const p = S.prices[g.id];
  const max = qtyMax(t);
  const verb = t.side === 'buy' ? 'Buy' : 'Sell';
  const info = t.side === 'buy' ? `you can afford ${Math.floor(S.cash / p)}, room for ${free(S)}` : `you hold ${S.stash[g.id] || 0}`;
  return `<tr class="trade-row"><td colspan="6"><form data-form="qty" class="trade" aria-label="${verb} ${g.name}">
    <span class="tv">${verb} ${g.name}</span><span class="note">${fmt(p)} each · ${info}</span>
    ${t.side === 'buy' && S.day === S.days ? `<span class="warn">Last day: anything you can't sell today is worth nothing.</span>` : ''}
    <span class="qrow">
      <button type="button" data-act="qadj" data-v="-10" aria-label="10 fewer">−10</button><button type="button" data-act="qadj" data-v="-1" aria-label="1 fewer">−1</button>
      <input id="pc-qty" inputmode="numeric" autocomplete="off" value="${t.qty}" aria-label="Quantity to ${verb.toLowerCase()}">
      <button type="button" data-act="qadj" data-v="1" aria-label="1 more">+1</button><button type="button" data-act="qadj" data-v="10" aria-label="10 more">+10</button>
      <button type="button" data-act="qmax"><kbd>M</kbd>Max ${max}</button>
      <span class="total">= <b id="pc-total">${fmt((intAmt(t.qty) || 0) * p)}</b></span>
      ${t.side === 'buy' ? `<span class="risk" id="pc-risk">${riskAfterText(t)}</span>` : ''}
      <button class="primary" type="submit"><kbd>Enter</kbd>${verb}</button><button type="button" data-act="qcancel"><kbd>Esc</kbd>Cancel</button>
    </span></form></td></tr>`;
}

function travelPanelHTML() {
  const due = S.debt > 0 && CONFIG.goonDays - S.debtAge <= 1;

    <h2>Where to?</h2>

    <ol class="dest">${PLACES.map((P, i) => `<li><button data-act="go" data-v="${P.id}" ${P.id === S.loc ? 'disabled' : ''}><kbd>${i + 1}</kbd><b>${P.name}</b><span>${P.id === S.loc ? 'You are here.' : P.special}</span></button></li>`).join('')}</ol>
    <button data-act="stay"><kbd>Esc</kbd>Stay here</button>
