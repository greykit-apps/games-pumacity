          : `<button class="primary" data-act="travel" aria-pressed="${!!(ui.modal && ui.modal.kind === 'map')}"><kbd>T</kbd>Travel</button>`}
        ${!last && u > 0 ? `<button data-act="sellall" ${sellable ? '' : 'disabled'} title="Sell everything you carry that someone here is buying"><kbd>A</kbd>Sell all</button>` : ''}
        ${svc && !last ? `<button data-act="service" title="${esc(P.serviceName)}"><kbd>V</kbd><span class="lg">${esc(P.serviceName)}</span><span class="sm">${esc(P.serviceShort || P.serviceName)}</span></button>` : ''}
        <span class="grow"></span>
        <button data-act="help" aria-label="Help" title="How to play (?)">?</button>
        ${ui.confirmCash ? '' : '<button data-act="menu" class="menu-btn"><kbd>Esc</kbd><span class="lg">Menu</span><span class="sm">More</span></button>'}
      </nav>
    </section>
    <aside class="side">
      ${ui.side === 'service' ? servicePanelHTML() : `<div class="place">
        <p class="spec">${P.special}</p>
        <p class="blurb">${P.blurb}</p>
        ${gearBlock}
        ${tip}
      </div>
      <div class="logwrap"><div class="log" id="pc-log" tabindex="0" aria-label="Log">${log}</div></div>`}
    </aside>
  </div>
</div>`;
}

// ---- modals
function modalHTML() {
  const m = ui.modal;
  if (S && S.over) return overHTML();
  if (S && S.enc) return encHTML();
  if (!m) return '';
  let body = '';
  switch (m.kind) {
    case 'help': body = helpHTML(m.tab || 'basics'); break;
    case 'menu': body = menuHTML(); break;
    case 'map': body = mapHTML(); break;
    case 'confirmNew': body = `<h1 id="pc-mt">Abandon this run?</h1><p>Your current run will not be scored.</p>
      <div class="acts"><button class="danger" data-act="newconfirm"><kbd>Y</kbd>Abandon and start over</button><button data-act="close"><kbd>Esc</kbd>Keep playing</button></div>`; break;
  }
  return `<div class="back" data-act="backdrop"><div class="modal${m.kind === 'map' ? ' map' : ''}" role="dialog" aria-modal="true" aria-labelledby="pc-mt">${body}</div></div>`;
}

function qtyMax(m) {
  const g = GOODS[m.good];
  const p = S.prices[g.id];
  if (m.side === 'buy') return p ? Math.max(0, Math.min(free(S), Math.floor(S.cash / p))) : 0;
  return S.stash[g.id] || 0;
}
function riskAfterText(t) {
  const g = GOODS[t.good];
  const now = carryRisk(S), after = carryRiskWith(S, g.id, intAmt(t.qty) || 0);
  if (after < RISK_SHOW) return '';
  const cls = riskClass(after);
  const pct = x => Math.round(x * 100);
  if (after - now < 0.005) {
    return after >= R(S).carryWatchMax
      ? `<span class="${cls}">Your load already draws the Watchers as hard as it can: about +${pct(after)}% a day.</span>`
      : `<span class="${cls}">Barely changes the Watcher odds: about +${pct(after)}% a day.</span>`;
  }
  const capped = after >= R(S).carryWatchMax ? ', the most it gets' : '';
  return `<span class="${cls}">After this, your load draws the Watchers: about +${pct(after)}% a day${capped}${now >= RISK_SHOW ? `, up from +${pct(now)}%` : ''}.</span>`;
}

/* The trade pop-over hangs off the Buy or Sell button that opened it, over
 * the table rather than pushing rows down. Its first control, right under
 * that button, trades the most you can: Buy then Max is two clicks, and
 * B then Enter is two keys. Near the foot of the table it opens upward. */
function tradePopHTML(t, i) {
  const g = GOODS[t.good];
  const p = S.prices[g.id];
  const max = qtyMax(t);
  const verb = t.side === 'buy' ? 'Buy' : 'Sell';
  const up = i >= GOODS.length - 3;
  const last = t.side === 'buy' && S.day === S.days;
  return `<form data-form="qty" class="tradepop ${t.side}${up ? ' up' : ''}" aria-label="${verb} ${g.name}">
    <button type="button" class="primary maxbtn" data-act="qmaxgo" ${max < 1 ? 'disabled' : ''}>${verb} max · ${max}</button>
    <div class="qline">
      <button type="button" data-act="qadj" data-v="-1" aria-label="One fewer">−</button>
      <input id="pc-qty" inputmode="numeric" autocomplete="off" value="${t.qty}" aria-label="How many to ${verb.toLowerCase()}">
      <button type="button" data-act="qadj" data-v="1" aria-label="One more">+</button>
      <button type="submit">${verb}</button>
    </div>
    <div class="qinfo"><b id="pc-total">${fmt((intAmt(t.qty) || 0) * p)}</b> at ${fmt(p)} each</div>
    ${t.side === 'buy' ? `<div class="risk" id="pc-risk">${riskAfterText(t)}</div>` : ''}
    ${last ? `<div class="warn">Last day: anything you can't sell today is worth nothing.</div>` : ''}
  </form>`;
}

/* An overhead map of PumaCity, as the author laid it out (600x600; each of
 * the 2x3 squares is 300x200):
 *   Convention Center | The Ranch
 *   The Vault         | Suburbs
 *   Starport          | Downtown
 * A north/south highway runs from the Starport up through the Vault to a
 * roundabout before the Convention Center. The suburbs' main road runs
 * north from Downtown, through the Suburbs, into the Ranch, and curves west
 * into the roundabout in front of the Convention Center, below its parking.
 * Drawn once and cached; the live badges sit on buttons above it. */
let cityArt = null;
function cityMapSVG() {
  if (cityArt) return cityArt;
  const r = (x, y, w, h, c) => `<rect class="${c || 'bd1'}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  let o = '';
  // ground: a faint tint per district
  o += `<rect class="gnd" width="600" height="600"/>`;
  o += `<rect class="gnd-farm" x="300" y="0" width="300" height="200"/><rect class="gnd-hill" x="0" y="200" width="300" height="200"/>`;
  // the Vault (west, middle): rolling hills off the highway's west side, the
  // door the only structure, a dotted path to it from the highway
  for (const [y, a] of [[214, 8], [236, 12], [372, 10], [392, 6]]) o += `<path class="contour" d="M0 ${y} Q35 ${y - a} 70 ${y} T138 ${y}"/>`;
  o += `<ellipse class="contour" cx="66" cy="300" rx="56" ry="44"/><ellipse class="contour" cx="66" cy="300" rx="38" ry="28"/>`;
  o += `<ellipse class="contour" cx="232" cy="250" rx="46" ry="18"/><ellipse class="contour" cx="204" cy="364" rx="30" ry="13"/>`;
  o += `<path class="hillside" d="M44 312 Q66 276 88 312"/><circle class="door" cx="66" cy="302" r="16"/><circle class="door-in" cx="66" cy="302" r="8"/>`;
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; o += `<path class="door-t" d="M${(66 + Math.cos(a) * 16).toFixed(1)} ${(302 + Math.sin(a) * 16).toFixed(1)} L${(66 + Math.cos(a) * 20).toFixed(1)} ${(302 + Math.sin(a) * 20).toFixed(1)}"/>`; }
  o += `<path class="path" d="M143 328 C126 334 118 318 104 324 S92 312 86 308"/>`;
  // the Suburbs (east, middle): big arching streets, cul-de-sacs, houses.
  // One street plan, drawn twice through two clips: the Suburbs square, and
  // the strip of the Vault square that the outer street curves on into.
  const cx = 450, cy = 420;
  // cul-de-sacs: [angle in degrees, the street they branch off]; each turns
  // round inside the block beyond its street, never at a square's edge
  const SPOKES = [[235, 80], [305, 80], [214, 130], [326, 130], [245, 180], [295, 180], [200, 180]];
  const spokeLen = R => (R === 180 ? 28 : 25);
  const nearSpoke = (R, deg) => SPOKES.some(([d, r]) => r === R && Math.abs(deg - d) < 6);
  const streets = () => {
    let t = '';
    for (const R of [80, 130, 180]) t += `<path class="st" d="M${cx - R} ${cy} A${R} ${R} 0 0 1 ${cx + R} ${cy}"/>`;
    for (const [d, R] of SPOKES) {
      const a = d * Math.PI / 180, R2 = R + spokeLen(R);
      const x1 = cx + Math.cos(a) * R, y1 = cy + Math.sin(a) * R, x2 = cx + Math.cos(a) * R2, y2 = cy + Math.sin(a) * R2;
      t += `<path class="st" d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}"/><circle class="cul" cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="6"/>`;
    }
    return t;
  };
  const houses = keep => {
    let t = '';
    for (const R of [80, 130, 180]) {
      const n = Math.round(R / 7);
      for (let k = 1; k < n; k++) {
        const a = Math.PI + Math.PI * k / n, deg = a * 180 / Math.PI;
        for (const off of [-11, 11]) {
          if (off > 0 && nearSpoke(R, deg)) continue;  // keep the cul-de-sac stems clear
          const hx = cx + Math.cos(a) * (R + off), hy = cy + Math.sin(a) * (R + off);
          if (keep(hx, hy)) t += `<rect class="house" x="${(hx - 3).toFixed(1)}" y="${(hy - 3).toFixed(1)}" width="6" height="6"/>`;
        }
      }
    }
    return t;
  };
  o += `<clipPath id="pc-sub"><rect x="300" y="200" width="300" height="200"/></clipPath><g clip-path="url(#pc-sub)">`;
  o += streets() + houses((x, y) => y >= 206 && y <= 392 && x >= 303 && x <= 597 && Math.abs(x - 450) >= 9) + `</g>`;
  o += `<clipPath id="pc-sub2"><rect x="236" y="280" width="64" height="120"/></clipPath><g clip-path="url(#pc-sub2)">`;
  o += streets() + houses((x, y) => x < 297 && y > 284 && y < 394) + `</g>`;
  // the Convention Center (west, north): sprawling halls, an arena, parking
  o += r(18, 28, 150, 82) + r(26, 116, 108, 34) + r(140, 116, 34, 30);
  for (let x = 38; x < 168; x += 22) o += `<path class="roof" d="M${x} 28 V110"/>`;
  o += `<ellipse class="arena" cx="232" cy="74" rx="52" ry="38"/><ellipse class="arena-in" cx="232" cy="74" rx="30" ry="18"/>`;
  for (let x = 196; x < 292; x += 8) o += `<path class="lot" d="M${x} 122 V138 M${x} 142 V156"/>`;
  o += `<path class="lot" d="M192 140 H292"/>`;
  // the Ranch (east, north): fields, barn, paddock and windmill, with the
  // road curving through its south-west corner
  for (let y = 18; y < 132; y += 6) o += `<path class="row" d="M314 ${y} H432"/>`;
  for (let x = 472; x < 592; x += 6) o += `<path class="row" d="M${x} 18 V104"/>`;
  o += r(476, 118, 34, 20, 'barn') + `<path class="roof" d="M476 128 H510"/>` + r(520, 122, 14, 12);
  o += `<rect class="paddock" x="472" y="148" width="116" height="44" rx="16"/>`;
  o += `<circle class="mill" cx="452" cy="40" r="7"/><path class="mill" d="M445 40 H459 M452 33 V47"/>`;
  // the Starport (west, south): the pad along the west edge, then streets of hangars and warehouses
  o += `<rect class="pad" x="6" y="406" width="78" height="188"/><path class="pad-mark" d="M45 414 V586"/><circle class="pad-mark" cx="45" cy="500" r="22"/>`;
  for (let y = 414; y < 594; y += 18) o += `<circle class="lt" cx="9" cy="${y}" r="1.5"/><circle class="lt" cx="81" cy="${y}" r="1.5"/>`;
  o += `<path class="ship" d="M45 432 L60 466 L60 548 L30 548 L30 466 Z"/><path class="ship-w" d="M38 470 H52"/>`;
  for (const x of [108, 206]) o += `<path class="st" d="M${x} 404 V596"/>`;

  for (const y of [446, 556]) o += `<path class="st" d="M88 ${y} H300"/>`;
  for (const [x0, x1] of [[112, 142], [160, 202], [210, 254], [262, 296]]) {
    for (const [y0, y1] of [[408, 442], [450, 490], [512, 552], [560, 594]]) {
      o += r(x0, y0, x1 - x0, y1 - y0, 'hangar') + `<path class="roof" d="M${x0 + 3} ${(y0 + y1) / 2} H${x1 - 3}"/>`;
    }
  }
  // Downtown (east, south): the outer loop, two streets quartering it, the roundabout where they meet
  o += `<rect class="loop" x="318" y="414" width="264" height="172" rx="26"/>`;
  // the Suburbs' streets run on south out of their square: the outer one
  // doglegs into the Starport's east street, the inner two meet the loop
  {
    const arcX = (R, y, side) => 450 + side * Math.sqrt(R * R - (420 - y) ** 2);
    const loopTop = x => { const c = Math.min(556, Math.max(344, x)); return 440 - Math.sqrt(26 * 26 - (x - c) ** 2); };
    const f = n => n.toFixed(1);
    o += `<path class="st" d="M${f(arcX(180, 390, -1))} 390 L${f(arcX(180, 403, -1))} 403 L258 416 V596"/>`;
    for (const R of [80, 130]) for (const side of [-1, 1]) {
      const x = arcX(R, 403, side);
      o += `<path class="st" d="M${f(arcX(R, 392, side))} 392 L${f(x)} 403 V${f(loopTop(x))}"/>`;
    }
  }
  // the Starport's cross streets run on into the loop around the city centre
  o += `<path class="st" d="M296 446 H320 M296 556 H320"/>`;
  for (const [x, y, w, h] of [[336, 430, 22, 22], [336, 458, 22, 26], [416, 430, 20, 26], [470, 428, 26, 24], [504, 428, 26, 24], [540, 428, 26, 24], [470, 458, 40, 26], [520, 460, 46, 24],
    [334, 516, 30, 24], [372, 516, 30, 24], [410, 516, 24, 24], [334, 546, 46, 26], [388, 546, 46, 26]]) o += r(x, y, w, h);
  o += r(360, 426, 50, 50, 'tower') + `<rect class="pent" x="372" y="438" width="26" height="26"/><path class="marquee" d="M358 486 H412"/>`;
  o += `<path class="mall" d="M466 516 H570 V572 H548 V538 H488 V572 H466 Z"/><circle class="fount" cx="518" cy="556" r="7"/>`;
  for (const [x, y] of [[478, 582], [500, 584], [536, 584], [558, 582]]) o += `<path class="palm" d="M${x - 4} ${y} H${x + 4} M${x} ${y - 4} V${y + 4} M${x - 3} ${y - 3} L${x + 3} ${y + 3} M${x + 3} ${y - 3} L${x - 3} ${y + 3}"/>`;
  // roads over everything
  const road = d => `<path class="rd" d="${d}"/><path class="rdc" d="${d}"/>`;
  // the highway: Starport up through the Vault to the Convention Center
  o += `<path class="hwy" d="M150 182 V586"/><path class="rdc" d="M150 182 V586"/>`;
  // the road west from Downtown into the Starport, T-boning the highway
  o += road('M150 500 H600');
  // the suburbs' main road: up from Downtown, through the Suburbs, into the
  // Ranch, curving west to run just below the parking lot into the roundabout
  o += road('M450 600 V246 Q450 168 372 168 H163');
  o += `<circle class="rdring" cx="150" cy="168" r="14"/><circle class="island" cx="150" cy="168" r="7"/>`;
  o += `<circle class="rdring" cx="450" cy="500" r="18"/><circle class="island" cx="450" cy="500" r="10"/>`;
  cityArt = `<svg class="citymap" viewBox="0 0 600 600" aria-hidden="true" focusable="false">${o}</svg>`;
  return cityArt;
}

/* Where each district's button sits over the map, as % of the map. */
const SPOT = {
  convention: [0, 0, 50, 33.34], ranch: [50, 0, 50, 33.34],
  vault: [0, 33.33, 50, 33.34], suburbs: [50, 33.33, 50, 33.34],
  starport: [0, 66.66, 50, 33.34],
  pvn: [50, 66.66, 25, 16.67], plaza: [75, 83.33, 25, 16.67],
};

const ICON = {
  eye: '<svg viewBox="0 0 16 12" aria-hidden="true"><path d="M1 6 Q8 -1 15 6 Q8 13 1 6 Z"/><circle cx="8" cy="6" r="2.2"/></svg>',
  phone: '<svg viewBox="0 0 12 16" aria-hidden="true"><rect x="2" y="1" width="8" height="14" rx="1.5"/><path d="M4 4 H8 M4 7 H8 M4 10 H7"/></svg>',
  goons: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 L15 14 H1 Z"/><path d="M8 6 V9.5 M8 11.6 V12"/></svg>',
  safe: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 L14 4 V8 Q14 12.5 8 14.5 Q2 12.5 2 8 V4 Z"/><path d="M5 8 L7.2 10.2 L11 6"/></svg>',
  vet: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2 H10 V6 H14 V10 H10 V14 H6 V10 H2 V6 H6 Z"/></svg>',
  here: '<svg viewBox="0 0 12 16" aria-hidden="true"><path d="M6 15 Q1 8.5 1 5.5 A5 5 0 0 1 11 5.5 Q11 8.5 6 15 Z"/><circle cx="6" cy="5.5" r="1.8"/></svg>',
};
function watchLevel(r) { return r >= 0.25 ? 'high' : r >= 0.12 ? 'mid' : 'low'; }

/* The badges say what's waiting in each district: your position, the Watcher
 * odds on arrival (the engine's arrivalWatchOdds), the Pawphone's tip, the
 * goons, the vet. Keys stay 1-7 in PLACES order. */
function mapHTML() {
  const due = goonsDue(S);
  const hurt = S.hp < 60;
  const shown = new Set(['eye']);  // the legend lists only what's on the map
  const spot = id => {
    const i = PLACES.findIndex(P => P.id === id);
    const P = PLACES[i];
    const here = P.id === S.loc;
    const badges = [];
    const said = [];
    if (here) { badges.push(`<span class="bd here">${ICON.here}<span class="lg">You are here</span><span class="sm">Here</span></span>`); said.push('You are here'); }
    else {
      const r = arrivalWatchOdds(S, P.id);
      badges.push(`<span class="bd ${watchLevel(r)}" title="Chance the Watchers find you on arrival">${ICON.eye}${Math.round(r * 100)}%</span>`);
      said.push(`Watchers about ${Math.round(r * 100)}% on arrival`);
    }
    if (S.tip && S.tip.loc === P.id) { shown.add('tip'); badges.push(`<span class="bd tip" title="Your Pawphone shows tomorrow's prices here">${ICON.phone}prices</span>`); said.push("your Pawphone knows tomorrow's prices"); }
    if (due && P.id === 'pvn') { shown.add('safe'); badges.push(`<span class="bd safe" title="Her goons won't come for you here. Repay ${fmt(realPayment(S))} to call them off.">${ICON.safe}safe</span>`); said.push(`safe from her goons; repay ${fmt(realPayment(S))} to call them off`); }
    else if (due && !here) { shown.add('goons'); badges.push(`<span class="bd goons" title="Her goons may be waiting">${ICON.goons}goons</span>`); said.push('her goons may be waiting'); }
    if (hurt && P.service === 'vet') { shown.add('vet'); badges.push(`<span class="bd vet" title="The vet can patch you up">${ICON.vet}vet</span>`); said.push('the vet'); }
    const [x, y, w, h] = SPOT[id];
    const label = P.name.replace(/^The Convention Center$/, 'Convention Center');
    return `<button class="spot spot-${id}${here ? ' here' : ''}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%" data-act="go" data-v="${P.id}" ${here ? 'disabled aria-current="location"' : ''} aria-label="${P.name}. ${said.join('. ')}.">
      <span class="tag"><span class="lab"><kbd>${i + 1}</kbd><b>${label}</b></span><span class="badges">${badges.join('')}</span></span></button>`;
  };
  const spots = PLACES.map(P => spot(P.id)).join('');
  const key = {
    eye: `<span class="bd low">${ICON.eye}%</span> Watcher odds when you arrive`,
    tip: `<span class="bd tip">${ICON.phone}prices</span> Pawphone tip`,
    goons: `<span class="bd goons">${ICON.goons}goons</span> goons may be waiting`,
    safe: `<span class="bd safe">${ICON.safe}safe</span> safe from goons`,
    vet: `<span class="bd vet">${ICON.vet}vet</span> the vet`,
  };
  return `<h1 id="pc-mt">Where to?</h1>
  <p class="note">Every trip takes a day, and the debt grows ${pctText(R(S).debtRate)} overnight.</p>
  <div class="city" role="group" aria-label="Map of PumaCity">${cityMapSVG()}${spots}</div>
  <p class="legend">${['eye', 'tip', 'goons', 'safe', 'vet'].filter(k => shown.has(k)).map(k => `<span class="li">${key[k]}</span>`).join('')}</p>
  <div class="acts"><button data-act="close"><kbd>Esc</kbd>Stay here</button></div>`;
}

function moneyForm(kind, label, max, hint) {
  return `<form data-form="${kind}" class="row"><input inputmode="numeric" autocomplete="off" name="amt" placeholder="amount" aria-label="${label} amount">
    <button type="button" data-act="mmax" data-v="${max}">Max ${fmt(max)}</button><button class="primary" type="submit">${label}</button>
    ${hint ? `<span class="note">${hint}</span>` : ''}</form>`;
}

/* The one payment the Debt box points at, a click away: the smallest that
 * resets the goons' clock. Offered only while the clock is running and you
 * can cover it, and only when it's less than paying the lot. */
function quickPay(st) {
  const need = realPayment(st);
  if (st.debt <= 0 || st.debtAge === 0 || need >= st.debt || st.cash < need) return '';
  return `<div class="row"><button class="primary" data-act="quickpay" data-v="${need}">Pay ${fmt(need)} · resets the clock</button></div>`;
}

function servicePanelHTML() {
  const st = S;
  const P = here(st);
  let out = `<h2>${esc(P.serviceName)}</h2>`;
  if (P.service === 'loan') {
    out += `<p>Casey Benton looks up from a desk the size of a car. "Back so soon?"</p>
    <p>You owe <b>${fmt(st.debt)}</b>.${st.debt > 0 ? ` <span class="note">${st.debtAge} ${plural(st.debtAge, 'day')} since your last real payment (at least ${pctText(R(st).repayReset)} of the debt). Her goons come after ${R(st).goonDays} days without one.</span>` : ''}</p>
    ${quickPay(st)}
    ${st.debt > 0 ? moneyForm('repay', 'Repay', Math.min(st.cash, st.debt)) : ''}
    ${moneyForm('borrow', 'Borrow', Math.max(0, R(st).debtCap - st.debt), `She'll carry up to ${fmt(R(st).debtCap)}.`)}`;
  }
  if (P.service === 'bank') {
    out += `<p>The blast door rolls aside and the Overseer's terminal flickers awake. WELCOME BACK, DWELLER.</p>
    <p>Cash on you: <b>${fmt(st.cash)}</b> · In the Vault: <b>${fmt(st.bank)}</b>. <span class="note">The Vault pays ${pctText(R(st).bankRate)} a day.</span></p>
    ${moneyForm('deposit', 'Deposit', st.cash)}
    ${moneyForm('withdraw', 'Withdraw', st.bank)}`;
  }
  if (P.service === 'vet') {
    const missing = R(st).maxHp - st.hp;
    out += `<p>Health ${st.hp} / ${R(st).maxHp}. ${fmt(R(st).vetPerHp)} per HP.</p>`;
    out += missing <= 0 ? `<p class="note">You're in full health. Nothing to patch.</p>`
      : st.cash < R(st).vetPerHp ? `<p class="note">Even one HP costs ${fmt(R(st).vetPerHp)}; you have ${fmt(st.cash)}.</p>`
      : `<div class="row"><button class="primary" data-act="heal">Patch me up (${fmt(Math.min(missing, Math.floor(st.cash / R(st).vetPerHp)) * R(st).vetPerHp)})</button></div>`;
  }
  if (P.shop.length) {
    if (P.service) out += `<h2>For sale</h2>`;  // a shop-only panel's heading already says what it is
    out += `<table>${P.shop.map(id => {
      const it = GEAR[id];
      const owned = st.gear[it.slot] === id;
      const ok = canUpgrade(st, id);
      const why = owned ? 'owned' : !ok ? 'have better' : st.cash < it.price ? `short ${fmt(it.price - st.cash)}` : '';
      return `<tr><td><b>${it.name}</b><br><span class="note">${it.blurb}</span></td><td class="r">${fmt(it.price)}</td>
        <td class="r">${why ? `<span class="why${owned ? ' own' : ''}">${why}</span>` : `<button data-act="buygear" data-v="${id}">Buy</button>`}</td></tr>`;
    }).join('')}</table>`;
  }
  out += `<div class="flash" role="status">${esc(ui.flash)}</div><div class="acts"><button data-act="stay"><kbd>Esc</kbd>Done</button></div>`;
  return `<div class="logwrap"><div class="sidepanel" role="region" aria-label="${esc(P.serviceName)}">${out}</div></div>`;
}


/* One line per encounter choice: what it will cost or win, in numbers the
 * engine itself uses (runChance, giveUpCost, goonTake). */
function choiceCost(st, o) {
  const e = st.enc;
  const held = used(st);
  const units = n => `${n} ${plural(n, 'unit')}`;
  const collar = st.gear.armour ? ' (less with your collar)' : '';
  switch (o) {
    case 'run': {
      const pct = Math.round(runChance(st) * 100);
      return `${pct}% to get away${st.gear.mittens ? ', with your Sneaky Mittens' : ''}. If not, ${held ? `you spill ${Math.round(R(st).dropOnFail * 100)}% of your ${units(held)} and ` : ''}they get a swing at you.`;
    }
    case 'fight': {
      const W = GEAR[st.gear.weapon];
      const n = e.foes.length;
      return `Your ${W.name} lands 3 times in 4 for ${W.dmg[0]}–${W.dmg[1]}. ${n === 1 ? 'They hit' : `Each of ${n} hits`} back ${Math.round(e.hitP * 100)}% of the time for ${e.dmg[0]}–${e.dmg[1]}${collar}.`;
    }
    case 'surrender': {
      const c = giveUpCost(st);
      if (e.type === 'watchers') return c.units ? `Lose all ${units(c.units)} and ${fmt(c.cash)}. Your heat drops to 10.` : `A ${fmt(c.cash)} fine for loitering.`;
      return c.units ? `They take ${units(c.units)}: half of each good.` : `They take ${fmt(c.cash)}.`;
    }
    case 'deal': {
      const d = e.deal, q = dealQty(st, d), g = GOOD[d.good];
      return d.side === 'buy' ? `+${fmt(q * d.price)} for ${q} ${g.name}.` : `${fmt(q * d.price)} for ${q} ${g.name}: a ${priceStanding(g, d.price).word} price.`;
    }
    case 'leave': return 'Nothing happens.';
    case 'sell': return `+${fmt(e.qty * e.price)} for all ${e.qty} Skooma.`;
    case 'decline': return 'Nothing happens.';
    case 'pay': return e.type === 'boss' ? `${fmt(e.amount)}. Your heat drops to 0.` : `${fmt(e.demand)} off your debt, and the goon clock resets.`;
    case 'refuse': return e.type === 'boss'
      ? `Your heat rises to ${Math.min(100, st.heat + 20)}.`
      : `They hit you for 12–28${collar} and take ${fmt(goonTake(st))} toward the debt.`;
    case 'buy': return `${fmt(e.price)}, ${Math.round((1 - e.price / GEAR[e.item].price) * 100)}% off the shop price.`;
  }
  return '';
}

function encHTML() {
  const st = S;
  const e = st.enc;
  const opts = encOptions(st);
  // the cautious choice: it takes the focus, so it wears the primary style
  const safe = ['run', 'leave', 'decline', 'refuse'].find(v => opts.includes(v));
  const keyOf = o => Object.keys(ENC_KEYS).find(k => ENC_KEYS[k].includes(o)).toUpperCase();
  const LABEL = { run: 'Run', fight: 'Fight', surrender: 'Give up', deal: 'Deal', leave: 'Walk away', sell: 'Sell', decline: 'Decline', pay: 'Pay', refuse: 'Refuse', buy: 'Buy' };
  let title = '';
  let body = '';
  if (e.type === 'watchers' || e.type === 'rival') {
    title = e.type === 'watchers' ? 'Watchers!' : (e.hostile ? 'Rival crew' : 'A rival dealer');
    if (e.type === 'rival' && !e.hostile) {
      const d = e.deal;
      const g = GOOD[d.good];
      const q = dealQty(st, d);
      body += d.side === 'buy'
        ? `<p>${esc(e.boss)} wants your ${g.name}: up to ${d.qty} at <b>${fmt(d.price)}</b> each${st.prices[g.id] != null ? ` (${fmt(st.prices[g.id])} on the street here)` : ''}.</p>`
        : `<p>${esc(e.boss)} is offloading ${d.qty} ${g.name} at <b>${fmt(d.price)}</b> each${st.prices[g.id] != null ? ` (${fmt(st.prices[g.id])} on the street here)` : ''}.</p>
          <p class="note">${q > 0 ? `You can take ${q}.` : 'You have no room or no cash for it.'}</p>`;
    } else {
      body += `<div class="foes">${e.foes.map(f => `<div class="foe"><span>${esc(f.name)} <span class="dim">${Math.max(0, f.hp)} HP</span></span>${meter(f.hp, f.max, 'low')}</div>`).join('')}</div>`;
    }
    body += `<div class="foe"><span>You <span class="dim">${st.hp} HP</span></span>${meter(st.hp, R(st).maxHp, st.hp <= 30 ? 'low' : '')}</div>`;
    // only where a fight would have been on offer: a deal has no Fight to miss
    if (!st.gear.weapon && opts.includes('run')) body += '<p class="note">You have no weapon, so you can only run or give up. The outfitter at Market Plaza sells them.</p>';
  } else if (e.type === 'boss') {
    title = 'The Boss';
    body = e.ask === 'skooma'
      ? `<p>Casey Benton wants all ${e.qty} of your Skooma at <b>${fmt(e.price)}</b> each: <b>${fmt(e.qty * e.price)}</b> in total.</p>`
      : `<p>Casey Benton suggests a <b>${fmt(e.amount)}</b> donation to make your heat go away. Refusing will make it worse.</p>${st.cash < e.amount ? '<p class="note">You don\'t have that much cash on you.</p>' : ''}`;
  } else if (e.type === 'goons') {
    title = "The Boss's goons";
    body = `<p>They want <b>${fmt(e.demand)}</b> toward your debt, now. Refuse and they'll take it out of your hide and your pockets.</p>${st.cash < e.demand ? '<p class="note">You don\'t have that much cash on you.</p>' : ''}`;
  } else if (e.type === 'stray') {
    const it = GEAR[e.item];
    title = 'A stray';
    body = `<p>${it.name} for <b>${fmt(e.price)}</b> (${fmt(it.price)} in the shops). <span class="note">${it.blurb}</span></p>`;
  }
  const lines = st.log.filter(l => l.n > (e.from || 0)).map(l => `<p class="${l.cls}">${esc(l.text)}</p>`).join('');
  const enter = ui.encFresh ? ' enter' : '';
  ui.encFresh = false;
  return `<div class="back enc-back"><div class="modal encounter t-${e.type}${enter}" role="alertdialog" aria-modal="true" aria-labelledby="pc-mt">
    <h1 id="pc-mt">${esc(title)}</h1>${body}
    <div class="elog" id="pc-elog">${lines}</div>
    <div class="choices">${opts.map(o => `<button data-act="enc" data-v="${o}" aria-describedby="pc-c-${o}" class="${o === safe ? 'primary' : ''}"><kbd>${keyOf(o)}</kbd>${LABEL[o]}</button><span class="cost" id="pc-c-${o}">${choiceCost(st, o)}</span>`).join('')}</div>
  </div></div>`;
}

/* One line that tells you how the run went, celebrating a board place. */
function verdict(score, rank) {
  if (score < 0) return `<p class="verdict bad">You leave PumaCity still owing Casey Benton. She'll remember.</p>`;
  if (rank === 0) return `<p class="verdict best">A new best score for this difficulty and run length.</p>`;
  if (rank > 0) return `<p class="verdict good">Number ${rank + 1} on the board.</p>`;
  return `<p class="verdict dim">Debt cleared. Not a board score this time.</p>`;
}

function overHTML() {
  const st = S;
  const o = st.over;
  const list = board(st.preset, st.days);
  const dead = o.reason === 'dead';
  return `<div class="back"><div class="modal${dead ? ' dead' : ''}" role="alertdialog" aria-modal="true" aria-labelledby="pc-mt">
    <h1 id="pc-mt">${dead ? 'You died' : 'The run is over'}</h1>
    ${dead ? `<p class="bad">${esc(o.why)}</p><p>Day ${o.day} of ${st.days}. ${o.score < 0 ? `The debt outlives you: <b>${fmt(o.score)}</b>.` : 'Whatever you were worth dies with you: <b>$0</b>.'} A death ranks below every run played out.</p>` : `
    <p class="final${o.score < 0 ? ' neg' : ''}">${fmt(o.score)}</p>
    ${verdict(o.score, ui.rank)}
    <table><tr><td>Cash</td><td class="r">${fmt(st.cash)}</td></tr><tr><td>Bank</td><td class="r">${fmt(st.bank)}</td></tr>
    <tr><td>Still owed to The Boss</td><td class="r">${fmt(-st.debt)}</td></tr>

    </table>`}
    <p class="note">${st.stats.peak > 0 ? `Best net worth during the run: ${fmt(st.stats.peak)}. ` : ''}Fights won: ${st.stats.won}. Escapes: ${st.stats.fled}. Busts: ${st.stats.busted}.</p>
    <h2>High scores · ${presetName(st.preset)}, ${st.days} days</h2>${scoreTable(list, ui.rank)}
    <div class="acts"><button class="primary" data-act="again"><kbd>N</kbd>New run</button><button data-act="title"><kbd>Esc</kbd>Title screen</button></div>
  </div></div>`;
}

function menuHTML() {
  return `<h1 id="pc-mt">Menu</h1>
  <div class="acts" style="flex-direction:column;align-items:stretch">
    <button data-act="close"><kbd>Esc</kbd>Back to the game</button>
    <button data-act="help"><kbd>?</kbd>How to play</button>
    <button data-act="title"><kbd>Q</kbd>Title screen (your run is saved)</button>
    <button class="danger" data-act="newrun"><kbd>N</kbd>Abandon run and start over</button>
  </div>`;

function helpHTML(tab) {
  const r = S ? R(S) : RULES;  // help opens from the title screen too
  const tabs = [['basics', 'Basics'], ['places', 'Places'], ['goods', 'Goods'], ['gear', 'Gear'], ['keys', 'Keys']];
  let body = '';
  if (tab === 'basics') body = `<dl class="help">
    <dt>The goal</dt><dd>Finish the run with as much money as you can. Your score is your cash plus your bank balance, minus whatever you still owe The Boss.</dd>
    <dt>The debt</dt><dd>You start owing Casey Benton, The Boss, ${fmt(r.startDebt)}. It grows ${pctText(r.debtRate)} every day. Pay it down at PVN Tower. Go ${r.goonDays} days without a real payment (at least ${pctText(r.repayReset)} of the debt) and her goons come to collect; the Debt box counts down to them.</dd>
    <dt>Trading</dt><dd>Each day you're somewhere new, and prices are new too. Buy cheap, carry it somewhere better, and sell. Your pouch holds ${r.baseCap} units until you buy a bigger one. The <i>vs usual</i> column says whether a price is a bargain, cheap, fair, steep or sky-high for that good, and the Held column shows what you paid and how today's price compares. A faint tick on the same line marks the last price you saw for it. A headline (shown above the market, and marked ! in it) sends one good's price wild.</dd>
    <dt>Travel</dt><dd>Each trip takes one day. Travel opens a map of PumaCity. Each district shows the chance the Watchers find you there tomorrow, and badges flag where the goons may be waiting (PVN Tower is always safe from them), where your Pawphone knows tomorrow's prices, and the vet when you're hurt. On your last day you can't travel; sell everything and cash out. Goods left in your pouch are worth nothing.</dd>
    <dt>Heat</dt><dd>Big sales and fights raise your heat: cool, warm, hot, then wanted. The hotter you are, the more often the Watchers come and the more of them there are. A heavy load draws them too, whatever your heat: the Pouch box shows its pull, and the buy box tells you before you add to it. It cools a little every day, faster at The Ranch, and The Boss will make it vanish for a price.</dd>
    <dt>Encounters</dt><dd>Watchers and rival crews: run, fight (you need a weapon), or give up. Giving up to the Watchers costs your whole stash and a fine; a failed getaway spills part of your load. The more you carry, the more often they come. If your health hits zero, the run is over: you keep any debt on your score but none of your money, and a death ranks below every run played out. Money in the bank is safe from muggers.</dd>
  </dl>`;
  if (tab === 'places') body = `<dl class="help">${PLACES.map(P => `<dt>${P.name}</dt><dd>${P.blurb} ${P.special}</dd>`).join('')}</dl>`;
  if (tab === 'goods') body = `<table><tr><th>Good</th><th class="r">Usual price</th><th></th></tr>${GOODS.map(g => `<tr><td>${g.name}</td><td class="r">${fmt(g.lo)}–${fmt(g.hi)}</td><td class="note">${g.blurb}</td></tr>`).join('')}</table>`;
  if (tab === 'gear') body = `<table><tr><th>Item</th><th class="r">Price</th><th>Where</th></tr>${Object.keys(GEAR).map(id => {
    const where = PLACES.filter(P => P.shop.includes(id)).map(P => P.name).join(', ');
    return `<tr><td><b>${GEAR[id].name}</b><br><span class="note">${GEAR[id].blurb}</span></td><td class="r">${fmt(GEAR[id].price)}</td><td class="note">${where}</td></tr>`;
  }).join('')}</table><p class="note">Pouches and weapons only trade up: a new one replaces the old. Strays sometimes sell them cheap.</p>`;
  if (tab === 'keys') body = `<table>
    <tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>Select a good</td></tr>
    <tr><td><kbd>B</kbd> / <kbd>S</kbd></td><td>Buy or sell the selected good; <kbd>Enter</kbd> then trades the most you can, or type an amount first</td></tr>
    <tr><td><kbd>M</kbd> <kbd>↑</kbd> <kbd>↓</kbd></td><td>In the quantity box: the most you can, one more, one fewer</td></tr>
    <tr><td><kbd>A</kbd></td><td>Sell all: everything you carry that someone here is buying</td></tr>
    <tr><td>Double-click</td><td>Buy or Sell with the mouse: trades the most you can</td></tr>
    <tr><td><kbd>Z</kbd></td><td>Undo your last trade (for a few seconds after it)</td></tr>
    <tr><td><kbd>T</kbd></td><td>Travel: a map of PumaCity opens; <kbd>1</kbd>–<kbd>7</kbd> picks a district</td></tr>
    <tr><td><kbd>E</kbd></td><td>Cash out on the last day; <kbd>E</kbd> again confirms</td></tr>
    <tr><td><kbd>V</kbd></td><td>Visit this place's shop or office</td></tr>
    <tr><td><kbd>R</kbd> <kbd>F</kbd> <kbd>U</kbd></td><td>Encounters: run, fight, give up. <kbd>Y</kbd> accepts an offer and <kbd>N</kbd> turns it down; every choice shows its key. None of them is a market key, so a key you were already pressing can't answer an encounter by mistake.</td></tr>
    <tr><td><kbd>Enter</kbd> / <kbd>Esc</kbd></td><td>Confirm / close</td></tr></table>`;

  ${body}
  <div class="acts"><button data-act="close"><kbd>Esc</kbd>Close</button></div>`;

/* Every render rebuilds the page, which would drop keyboard focus to <body>
 * after each move. Remember what had focus by what it does (data-act and
 * data-v, or its id) and put focus back on the same control afterwards.
 * Opening a dialog focuses its first control; closing one returns focus to
 * whatever opened it. */
function focusKey(el) {
  if (!el || el === document.body || !root.contains(el)) return null;
  if (el.id) return { id: el.id };
  const a = el.closest('[data-act]');
  return a ? { act: a.dataset.act, v: a.dataset.v } : null;
}
function findFocus(k, within) {
  if (!k) return null;
  if (k.id) return document.getElementById(k.id);
  const sel = `[data-act="${k.act}"]` + (k.v != null ? `[data-v="${CSS.escape(k.v)}"]` : '');
  const el = (within || root).querySelector(sel);
  return el && !el.disabled ? el : null;
}
const FOCUSABLE = 'button:not(:disabled),input,select,[tabindex="0"],a[href]';
function announce(lines) {
  const live = document.getElementById('pc-live');
  if (!live || !lines.length) return;
  live.textContent = '';
  setTimeout(() => { live.textContent = lines.join(' '); }, 30);
}

/* Trade feedback, run after the page is rebuilt: a floating delta by Cash,
 * the Cash figure counting to its new value, and a flash on the traded rows.
 * Transform, opacity and colour only; nothing moves under reduced motion. */
let fxToken = 0;
function runFx() {
  const fx = ui.fx;
  ui.fx = null;
  if (!fx) return;
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cash = root.querySelector('.stat.cash');
  const val = cash && cash.querySelector('span');
  const delta = fx.to - fx.from;
  if (cash && delta) {
    const d = document.createElement('span');
    d.className = 'delta ' + (delta > 0 ? 'up' : 'down');
    d.setAttribute('aria-hidden', 'true');
    d.textContent = (delta > 0 ? '+' : '−') + fmt(Math.abs(delta));
    cash.appendChild(d);
    setTimeout(() => d.remove(), calm ? 1200 : 1000);
  }
  if (val && delta && !calm) {
    const token = ++fxToken, t0 = performance.now(), dur = 650;
    val.textContent = fmt(fx.from);
    const tick = now => {
      if (token !== fxToken || !val.isConnected) return;
      const k = Math.min(1, (now - t0) / dur);
      val.textContent = fmt(Math.round(fx.from + delta * (1 - Math.pow(1 - k, 4))));
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  for (const i of fx.rows) {
    const tr = root.querySelector(`tr[data-act="sel"][data-v="${i}"]`);
    if (!tr) continue;
    tr.classList.add('traded');
    const hq = tr.querySelector('.hq');
    if (hq) hq.classList.add('pulse');
  }
}

/* Put the pop-over's max button exactly over the Buy or Sell button that
 * opened it (same top, right edge and height; wider to the left for its
 * label), so a second click without moving the mouse trades the max. */
function placeTradePop() {
  const pop = root.querySelector('.tradepop');
  if (!pop || !ui.trade) return;
  const trig = pop.parentElement.querySelector(`:scope > button[data-act="${ui.trade.side}"]`);
  const max = pop.querySelector('.maxbtn');
  if (!trig || !max) return;
  // 1px of overhang on every side, so rounding can never leave a sliver of
  // the original button exposed
  max.style.minHeight = (trig.offsetHeight + 2) + 'px';
  max.style.minWidth = (trig.offsetWidth + 2) + 'px';
  pop.style.right = 'auto';
  pop.style.bottom = 'auto';
  pop.style.left = (trig.offsetLeft + trig.offsetWidth - max.offsetLeft - max.offsetWidth) + 'px';
  pop.style.top = (trig.offsetTop - max.offsetTop) + 'px';
  // offsets ignore borders and table-cell rounding; finish against the real boxes
  const tr = trig.getBoundingClientRect(), mr = max.getBoundingClientRect();
  pop.style.left = (parseFloat(pop.style.left) + (tr.right + 1 - mr.right)) + 'px';
  pop.style.top = (parseFloat(pop.style.top) + (tr.top - 1 - mr.top)) + 'px';
}

let lastScreen = null;  // outside ui, which new runs and resumes replace
function render() {
  // Rebuilding the page can let the browser clamp the scroll position at the
  // first layout (it did when a trade pop-over opened low on a phone, sliding
  // the max button out from under the finger). Every render holds the page
  // where it was; deliberate scrolls happen after this. A change of screen
  // (title to game and back) starts at the top instead.
  const screen = S ? 'game' : 'setup';
  const scrollAt = lastScreen && lastScreen !== screen ? [0, 0] : [window.scrollX, window.scrollY];
  lastScreen = screen;
  const before = focusKey(document.activeElement);
  const hadModal = !!root.querySelector('.back');
  const titleModal = !S && ui.modal && (ui.modal.kind === 'help' ? helpHTML(ui.modal.tab || 'basics') : ui.modal.kind === 'rules' ? rulesHTML() : '');
  const modal = S ? modalHTML() : (titleModal
    ? `<div class="back" data-act="backdrop"><div class="modal${ui.modal.kind === 'rules' ? ' rules' : ''}" role="dialog" aria-modal="true" aria-labelledby="pc-mt">${titleModal}</div></div>` : '');
  setScene(S ? S.loc : 'pvn');
  if (S && S.enc && ui.encSeen !== S.enc.from + ':' + S.day) {
    ui.encSeen = S.enc.from + ':' + S.day;
    ui.encUntil = performance.now() + ENC_LOCK_MS;
    ui.encFresh = true;
  }
  root.innerHTML = `<div class="stage">${S ? gameHTML() : setupHTML()}</div>` + modal;
  if (ui.arrived) { const h = root.querySelector('.place-name'); if (h) h.classList.add('arrive'); ui.arrived = false; }
  const log = document.getElementById('pc-log');
  if (log) log.scrollTop = log.scrollHeight;
  const elog = document.getElementById('pc-elog');
  if (elog) elog.scrollTop = elog.scrollHeight;
  placeTradePop();
  if (window.scrollX !== scrollAt[0] || window.scrollY !== scrollAt[1]) window.scrollTo(scrollAt[0], scrollAt[1]);
  const dlg = root.querySelector('.back .modal');
  const q = document.getElementById('pc-qty');
  let target = null;
  if (dlg && !hadModal) {
    ui.opener = before;
    // An encounter opens on its cautious choice (run, walk away, decline,
    // refuse), so a stray Enter can't start a brawl or spend your money.
    target = q || dlg.querySelector('input')
      || (S && S.enc ? ['run', 'leave', 'decline', 'refuse'].map(v => dlg.querySelector(`[data-act="enc"][data-v="${v}"]`)).find(Boolean) : null)
      || dlg.querySelector('button.primary:not(:disabled)') || dlg.querySelector(FOCUSABLE);
  } else if (dlg) {
    target = findFocus(before, dlg) || q || dlg.querySelector(FOCUSABLE);
  } else if (ui.panelFresh) {
    target = ui.panelFresh === 'trade' ? q
      : ui.panelFresh === 'confirm' ? root.querySelector('[data-act="finishconfirm"]')
      : root.querySelector('.sidepanel input') || root.querySelector('.sidepanel button.primary:not(:disabled)') || root.querySelector('.sidepanel button:not(:disabled)');
    if (ui.panelFresh === 'service' && window.matchMedia('(max-width:900px)').matches) {
      const panel = root.querySelector('.sidepanel');
      if (panel) panel.scrollIntoView({ block: 'start' });
    }
    ui.panelFresh = null;
  } else if (ui.panelOpener && !ui.trade && !ui.side) {
    target = findFocus(ui.panelOpener) || findFocus(before);
    ui.panelOpener = null;
  } else {
    target = findFocus(hadModal ? ui.opener : before) || (hadModal ? findFocus(before) : null);
    if (hadModal) ui.opener = null;
  }
  // select() scrolls the input into view whatever focus() was told, and on a
  // phone that would slide the max button out from under the finger that
  // just tapped Buy. Hold the page exactly where it was.
  const sx = window.scrollX, sy = window.scrollY;
  if (target) target.focus({ preventScroll: true });
  if (target === q && q) q.setSelectionRange(0, q.value.length);
  if (window.scrollX !== sx || window.scrollY !== sy) window.scrollTo(sx, sy);
  runFx();
}

// ---- input
function openQty(i, side) {
  const g = GOODS[i];
  if (S.prices[g.id] == null) { ui.flash = `Nobody is trading ${g.name} here today.`; render(); return; }
  if (side === 'sell' && !S.stash[g.id]) { ui.flash = `You don't have any ${g.name}.`; render(); return; }
  ui.sel = i;
  const t = { good: i, side, qty: 0 };
  t.qty = qtyMax(t);
  if (!ui.trade && !ui.side) ui.panelOpener = focusKey(document.activeElement) || { act: side, v: String(i) };
  ui.trade = t;
  ui.side = null;
  ui.panelFresh = 'trade';
  ui.flash = '';
  render();
}
function toggleQty(i, side) {
  if (ui.trade && ui.trade.good === i && ui.trade.side === side) { closePanels(); return; }
  openQty(i, side);
}
function closePanels() { ui.trade = null; ui.side = null; ui.confirmCash = false; ui.flash = ''; render(); }
/* Travel and the shop/office share one slot beside the market, in place of
 * the place panel and log, so the prices and your cash stay in view. */
function openSide(which) {
  if (S.day >= S.days) return;
  if (which === 'service' && !(here(S).service || here(S).shop.length)) return;
  if (ui.side === which) { closePanels(); return; }
  if (!ui.trade && !ui.side) ui.panelOpener = focusKey(document.activeElement) || { act: which };
  ui.trade = null;
  ui.side = which;
  ui.panelFresh = which;
  ui.flash = '';
  render();
}
function openTravel() {
  if (S.day >= S.days) return;
  ui.trade = null;
  ui.side = null;
  ui.flash = '';
  ui.modal = ui.modal && ui.modal.kind === 'map' ? null : { kind: 'map' };
  render();
}
function setQty(n) {
  const m = ui.trade;
  m.qty = clamp(n, 0, qtyMax(m));
  const input = document.getElementById('pc-qty');
  if (input) input.value = m.qty;
  updateTotal();
}
function updateTotal() {
  const m = ui.trade;
  const input = document.getElementById('pc-qty');
  const t = document.getElementById('pc-total');
  if (!m || !input || !t) return;
  m.qty = intAmt(input.value.replace(/[^\d]/g, ''));
  t.textContent = fmt(m.qty * S.prices[GOODS[m.good].id]);
  const risk = document.getElementById('pc-risk');
  if (risk) risk.innerHTML = riskAfterText(m);
}
function closeModal() { ui.modal = null; ui.flash = ''; render(); }

root.addEventListener('click', e => {
  if (ui.trade && !e.target.closest('.tradepop') && !e.target.closest('[data-act="buy"],[data-act="sell"]')) {
    ui.trade = null;
    ui.flash = '';
    if (!e.target.closest('[data-act]')) { render(); return; }
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case 'backdrop': if (e.target === el) closeModal(); return;
    case 'days': prefs.days = Number(v); scoreTab = prefs.days; save(KEY_PREFS, prefs); render(); return;
    case 'scoretab': scoreTab = Number(v); render(); return;
    case 'preset':
      prefs.preset = v === 'custom' || PRESETS[v] ? v : 'regular'; save(KEY_PREFS, prefs);
      if (v === 'custom') ui.modal = { kind: 'rules' };  // choosing Custom opens its rules
      render(); return;
    case 'rules': ui.modal = { kind: 'rules' }; render(); return;
    case 'rulesfrom': prefs.custom = choicesFor(presetRules(v)); save(KEY_PREFS, prefs); render(); return;
    case 'start': startRun(); return;
    case 'resume': resume(); return;
    case 'help': ui.modal = { kind: 'help', tab: 'basics' }; render(); return;
    case 'helptab': ui.modal = { kind: 'help', tab: v }; render(); return;
    case 'close': closeModal(); return;
    case 'sel': if (e.target.closest('button')) return; ui.sel = Number(v); render(); return;
    case 'buy': toggleQty(Number(v), 'buy'); return;
    case 'sell': toggleQty(Number(v), 'sell'); return;
    case 'qadj': setQty(ui.trade.qty + Number(v)); return;
    case 'qmax': setQty(qtyMax(ui.trade)); return;
    case 'qmaxgo': { const t = ui.trade; act({ t: t.side, good: GOODS[t.good].id, qty: qtyMax(t) }); return; }
    case 'stay': closePanels(); return;
    case 'undo': undoLast(); return;
    case 'coachoff': prefs.coachDone = true; save(KEY_PREFS, prefs); render(); return;
    case 'finishcancel': ui.confirmCash = false; ui.panelOpener = null; render(); return;
    case 'sellall': act({ t: 'sellall' }); return;
    case 'quickpay': act({ t: 'repay', amt: +v }); return;
    case 'mmax': { const inp = el.closest('form').querySelector('input'); inp.value = v; inp.focus(); return; }
    case 'travel': openTravel(); return;
    case 'go': act({ t: 'travel', to: v }); return;
    case 'finish': ui.confirmCash = true; ui.trade = null; ui.panelOpener = null; ui.panelFresh = 'confirm'; render(); return;
    case 'finishconfirm': act({ t: 'finish' }); return;
    case 'service': openSide('service'); return;
    case 'buygear': act({ t: 'gear', item: v }); return;
    case 'heal': act({ t: 'heal' }); return;
    case 'menu': ui.modal = { kind: 'menu' }; render(); return;
    case 'newrun': ui.modal = { kind: 'confirmNew' }; render(); return;
    case 'newconfirm': save(KEY_GAME, null); S = null; startRun(); return;
    case 'enc': if (!encLocked()) act({ t: v }); return;
    case 'again': S = null; startRun(); return;
    case 'title': quitToTitle(); return;
  }
});

root.addEventListener('toggle', e => {
  const d = e.target.closest && e.target.closest('details.logday');
  if (!d) return;
  if (!ui.openDays) ui.openDays = new Set();
  const day = Number(d.dataset.day);
  if (d.open) ui.openDays.add(day); else ui.openDays.delete(day);
}, true);

root.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target;
  const kind = form.dataset.form;
  if (kind === 'qty') {
    updateTotal();
    const m = ui.trade;
    act({ t: m.side, good: GOODS[m.good].id, qty: m.qty });
    return;
  }
  const amt = intAmt(String(form.querySelector('input').value).replace(/[^\d]/g, ''));
  act({ t: kind, amt });
});

root.addEventListener('input', e => { if (e.target.id === 'pc-qty') updateTotal(); });
root.addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.knob;
  if (!id) return;
  prefs.custom = Object.assign({}, prefs.custom, { [id]: Number(e.target.value) });
  save(KEY_PREFS, prefs);
  render();
});

/* Encounters interrupt the market on arrival, exactly when a hand is reaching
 * for a market key. So the two key sets share no letters (tools/check-all.js
 * holds them apart), and an encounter ignores input for a moment after it
 * appears, so a key already in flight can't answer it. */
const MARKET_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'b', 's', 'a', 't', 'e', 'v', 'h', 'z', '?', '/'];
const ENC_KEYS = { r: ['run'], f: ['fight'], u: ['surrender'], d: ['deal'], l: ['leave'], p: ['pay'], y: ['sell', 'buy'], n: ['refuse', 'decline'] };
const ENC_LOCK_MS = 400;
function encLocked() { return S && S.enc && performance.now() < (ui.encUntil || 0); }

function helpKey(k) {
  const tabs = ['basics', 'places', 'goods', 'gear', 'keys'];
  const i = tabs.indexOf(ui.modal.tab || 'basics');
  if (k === 'ArrowRight') { ui.modal = { kind: 'help', tab: tabs[(i + 1) % tabs.length] }; render(); }
  if (k === 'ArrowLeft') { ui.modal = { kind: 'help', tab: tabs[(i + tabs.length - 1) % tabs.length] }; render(); }
}

/* The Konami code. The arrows keep doing their normal jobs while it is typed;
 * only the B and A that finish the sequence are swallowed, so the code never
 * opens a buy or sells your stash. */
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let konamiAt = 0;
function konamiKey(k) {
  if (k === KONAMI[konamiAt]) {
    konamiAt++;
    if (konamiAt === KONAMI.length) { konamiAt = 0; konamiFire(); return true; }
    return konamiAt > KONAMI.length - 2;  // the B that sets up the final A
  }
  // a run of three or more ups still counts its last two
  konamiAt = k === 'ArrowUp' ? (konamiAt === 2 ? 2 : 1) : 0;
  return false;
}
function konamiFire() {
  const from = S.cash;
  S = cheat(S);
  save(KEY_GAME, S);
  ui.trade = null;
  ui.fx = { from, to: S.cash, rows: [] };
  announce([S.log[S.log.length - 1].text]);
  render();
}

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S && !S.over && e.key !== 'Tab' && konamiKey(e.key.length === 1 ? e.key.toLowerCase() : e.key)) { e.preventDefault(); return; }
  // Keep Tab inside an open dialog.
  if (e.key === 'Tab') {
    const dlg = root.querySelector('.back .modal');
    if (!dlg) return;
    const items = [...dlg.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null);
    if (!items.length) return;
    const i = items.indexOf(document.activeElement);
    const next = e.shiftKey ? (i <= 0 ? items.length - 1 : i - 1) : (i === -1 || i === items.length - 1 ? 0 : i + 1);
    e.preventDefault();
    items[next].focus();
    return;
  }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const inInput = e.target && e.target.tagName === 'INPUT';
  const m = ui.modal;

  if (!S) {
    if (m && m.kind === 'help') { if (k === 'Escape') closeModal(); else helpKey(k); return; }
    // the rules panel's selects take letters and arrows themselves
    if (m && m.kind === 'rules') { if (k === 'Escape') { e.preventDefault(); closeModal(); } return; }
    if (inInput) { if (k === 'Enter') { e.preventDefault(); startRun(); } return; }
    if (k === 'n' || k === 'Enter') { e.preventDefault(); startRun(); }
    else if (k === 'r' && loadGame()) resume();
    else if (k === '?' || k === '/') { ui.modal = { kind: 'help', tab: 'basics' }; render(); }
    return;
  }
  if (S.over) {
    if (k === 'n') { S = null; startRun(); } else if (k === 'Escape') quitToTitle();
    return;
  }
  if (S.enc) {
    if (encLocked()) { e.preventDefault(); return; }
    const opts = encOptions(S);
    const t = (ENC_KEYS[k] || []).find(o => opts.includes(o));
    if (t) { e.preventDefault(); act({ t }); }
    return;
  }
  if (m) {
    if (k === 'Escape') { e.preventDefault(); closeModal(); return; }
    if (inInput) return;
    if (m.kind === 'map') {
      if (k === 't') { closeModal(); return; }
      if (/^[1-7]$/.test(k)) { const P = PLACES[Number(k) - 1]; if (P.id !== S.loc) act({ t: 'travel', to: P.id }); }
      return;
    }
    if (m.kind === 'confirmNew' && k === 'y') { save(KEY_GAME, null); S = null; startRun(); return; }
    if (m.kind === 'menu') { if (k === '?' || k === '/') { ui.modal = { kind: 'help', tab: 'basics' }; render(); } else if (k === 'q') quitToTitle(); else if (k === 'n') { ui.modal = { kind: 'confirmNew' }; render(); } }
    if (m.kind === 'help') helpKey(k);
    return;
  }
  if (ui.trade) {
    if (k === 'Escape') { e.preventDefault(); closePanels(); return; }
    if (k === 'm') { e.preventDefault(); setQty(qtyMax(ui.trade)); return; }
    if (k === 'ArrowUp' || k === '+') { e.preventDefault(); setQty(ui.trade.qty + 1); return; }
    if (k === 'ArrowDown' || k === '-') { e.preventDefault(); setQty(ui.trade.qty - 1); return; }
  }
  if (ui.side === 'service') {
    if (k === 'Escape' || (!inInput && k === 'v')) { e.preventDefault(); closePanels(); return; }
  }
  if (inInput) return;
  if (/^[1-9]$/.test(k)) { ui.sel = Number(k) - 1; ui.trade = null; ui.flash = ''; render(); return; }
  if (k === 'a') { act({ t: 'sellall' }); return; }
  if (k === 'z') { undoLast(); return; }
  if (k === 'ArrowDown') { e.preventDefault(); ui.sel = (ui.sel + 1) % GOODS.length; render(); return; }
  if (k === 'ArrowUp') { e.preventDefault(); ui.sel = (ui.sel + GOODS.length - 1) % GOODS.length; render(); return; }
  if (k === 'b') { openQty(ui.sel, 'buy'); return; }
  if (k === 's') { openQty(ui.sel, 'sell'); return; }
  if (k === 't' && S.day < S.days) { openTravel(); return; }
  if (k === 'e' && S.day === S.days) {
    if (ui.confirmCash) act({ t: 'finish' });
    else { ui.confirmCash = true; ui.trade = null; ui.panelFresh = 'confirm'; render(); }
    return;
  }
  if (k === 'Escape' && ui.confirmCash) { e.preventDefault(); ui.confirmCash = false; render(); return; }
  if (k === 'v') { openSide('service'); return; }
  if (k === '?' || k === '/' || k === 'h') { ui.modal = { kind: 'help', tab: 'basics' }; render(); return; }
  if (k === 'Escape') { ui.modal = { kind: 'menu' }; render(); }
});

/* Debug and test hook. __PC.force('watchers') starts an encounter now. */
window.__PC = {
  get state() { return S; },
  act,
  force(type) { if (!S) return; S = forceEncounter(S, type); save(KEY_GAME, S); render(); },
  bot(n) { for (let i = 0; i < (n || 1) && S && !S.over; i++) act(botAct(S)); return S && S.over; },
  set(patch) { if (!S) return; S = Object.assign(JSON.parse(JSON.stringify(S)), patch); save(KEY_GAME, S); render(); },
};

S = null;
render();
</script>
</body>
</html>
