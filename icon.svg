<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PumaCity">
<title>PumaCity</title>
<!-- The premise, not the category: buy low, sell high, and keep one step
     ahead of the Watchers. The Watchers' eye is amber, the colour heat is
     drawn in on the terminal; the trade is cyan, the tribe's live thing. The
     eye looks down and back at the dip where you bought, and the price line
     has already climbed away past it. Paths only, no font.

     favicon-16x16.png, favicon-32x32.png, favicon.ico, apple-touch-icon.png
     and og.png are all rendered from this file; re-render them if it changes
     (README.md -> Icon and share card). -->
<rect width="64" height="64" rx="12" fill="#05070f"/>
<!-- A faint frame, so the tile still has an edge on the share card, whose
     ground is the same navy as the plate -->
<rect x="1.5" y="1.5" width="61" height="61" rx="10.5" fill="none" stroke="#1b2540" stroke-width="1.5"/>

<!-- The mark is drawn edge to edge, then scaled inside the frame -->
<g transform="translate(32 32) scale(.84) translate(-32 -32)">

<!-- The Watchers: an outlined eye, pupil turned down and to the left -->
<path d="M4 22 Q24 3 44 22 Q24 39 4 22Z" fill="none" stroke="#ffb000"
      stroke-width="4.5" stroke-linejoin="round"/>
<circle cx="21" cy="24" r="6.5" fill="#ffb000"/>
<circle cx="19.2" cy="25.8" r="2.4" fill="#05070f"/>

<!-- The trade: a dip to buy in, then the climb out to sell -->
<g fill="none" stroke="#54f2ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 51 L18 59 L30 49 L36 54 L56 36"/>
  <path d="M45 35 H57 V47"/>
</g>
</g>
</svg>
